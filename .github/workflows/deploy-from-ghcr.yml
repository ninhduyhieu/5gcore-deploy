name: Deploy from GHCR

on:
  repository_dispatch:
    types: [deploy-5gc]
  workflow_dispatch:
    inputs:
      image_owner:
        description: "GHCR owner"
        required: true
        default: "ninhduyhieu"
      image_tag:
        description: "Image tag"
        required: true
        default: "latest"

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Resolve variables
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "owner=${{ github.event.client_payload.image_owner }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.client_payload.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "owner=${{ inputs.image_owner }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set kubeconfig
        shell: bash
        run: |
          export KUBECONFIG="$GITHUB_WORKSPACE/kubeconfig"
          kubectl get nodes -o wide

      - name: Ensure namespace
        shell: bash
        run: |
          export KUBECONFIG="$GITHUB_WORKSPACE/kubeconfig"
          kubectl create namespace etri6g --dry-run=client -o yaml | kubectl apply -f -

      - name: Render manifests
        shell: bash
        run: |
          ./scripts/render-ghcr-images.sh "${{ steps.vars.outputs.owner }}" "${{ steps.vars.outputs.tag }}" rendered

      - name: Deploy manifests
        shell: bash
        run: |
          export KUBECONFIG="$HOME/.kube/5gcore-config"
          kubectl apply -f rendered/ctrl.yaml
          kubectl apply -f rendered/gw.yaml
          kubectl apply -f rendered/nsm.yaml
          kubectl apply -f rendered/mongo.yaml
          kubectl apply -f rendered/deploy-other.yaml

      - name: Verify pods
        shell: bash
        run: |
          export KUBECONFIG="$GITHUB_WORKSPACE/kubeconfig"
          kubectl get pods -n etri6g -o wide

      - name: Verify services
        shell: bash
        run: |
          export KUBECONFIG="$GITHUB_WORKSPACE/kubeconfig"
          kubectl get svc -n etri6g