name: Provision, Build and Deploy from Local Source

on:
  workflow_dispatch:
    inputs:
      image_owner:
        description: "GHCR owner"
        required: true
        default: "ninhduyhieu"
      image_tag:
        description: "Image tag"
        required: true
        default: "latest"

  push:
    branches: [main, develop]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ════════════════════════════════════════════════════
  # JOB 0 · DETECT — phát hiện file nào thay đổi
  # ════════════════════════════════════════════════════
  detect-changes:
    name: "Detect changed files"
    runs-on: ubuntu-latest
    outputs:
      need_provision: ${{ steps.detect.outputs.need_provision }}
      need_ansible: ${{ steps.detect.outputs.need_ansible }}
      need_build: ${{ steps.detect.outputs.need_build }}
      need_deploy: ${{ steps.detect.outputs.need_deploy }}
      need_monitoring: ${{ steps.detect.outputs.need_monitoring }}
      any_change: ${{ steps.detect.outputs.any_change }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect which layers changed
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "→ Manual trigger: Force run everything"
            echo "need_provision=true"   >> $GITHUB_OUTPUT
            echo "need_ansible=true"       >> $GITHUB_OUTPUT
            echo "need_build=true"           >> $GITHUB_OUTPUT
            echo "need_deploy=true"         >> $GITHUB_OUTPUT
            echo "need_monitoring=true" >> $GITHUB_OUTPUT
            echo "any_change=true"             >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          echo "Changed files:"
          echo "$CHANGED"
          echo "---"

          has_change() { echo "$CHANGED" | grep -qE "$1"; }

          PROVISION=false ANSIBLE=false BUILD=false DEPLOY=false MONITORING=false

          if [ -z "$CHANGED" ]; then
            PROVISION=true; ANSIBLE=true; BUILD=true; DEPLOY=true; MONITORING=true
          elif has_change '^Vagrantfile$'; then
            PROVISION=true; ANSIBLE=true; BUILD=true; DEPLOY=true; MONITORING=true
          elif has_change '^roles/|^playbook\.yml$|^inventory/|^ansible\.cfg$'; then
            ANSIBLE=true; BUILD=true; DEPLOY=true
          elif has_change '^k8s/|^rendered/|^scripts/'; then
            DEPLOY=true
          elif has_change '^observability/'; then
            MONITORING=true
          fi

          ANY=false
          ($PROVISION || $ANSIBLE || $BUILD || $DEPLOY || $MONITORING) && ANY=true

          echo "need_provision=$PROVISION"   >> $GITHUB_OUTPUT
          echo "need_ansible=$ANSIBLE"       >> $GITHUB_OUTPUT
          echo "need_build=$BUILD"           >> $GITHUB_OUTPUT
          echo "need_deploy=$DEPLOY"         >> $GITHUB_OUTPUT
          echo "need_monitoring=$MONITORING" >> $GITHUB_OUTPUT
          echo "any_change=$ANY"             >> $GITHUB_OUTPUT

  # ════════════════════════════════════════════════════
  # JOB 1 · CI: VALIDATE — lint YAML
  # ════════════════════════════════════════════════════
  validate:
    name: "CI · Validate YAML syntax"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.any_change == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML — k8s + observability + playbook
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" \
            k8s/ observability/ playbook.yml

      - name: Check required files exist
        run: |
          set -e
          for f in \
            Vagrantfile playbook.yml inventory/hosts.yaml \
            k8s/ctrl.yaml k8s/gw.yaml k8s/pran.yaml \
            k8s/nsm.yaml k8s/mongo.yaml k8s/deploy-other.yaml \
            observability/loki-values.yaml \
            observability/alloy-values.yaml \
            observability/grafana-values.yaml; do
            test -f "$f" && echo "✓ $f" || { echo "✗ $f MISSING"; exit 1; }
          done

  # ════════════════════════════════════════════════════
  # JOB 2 · CD: PROVISION — Khởi tạo hạ tầng (Vagrant + Ansible)
  # ════════════════════════════════════════════════════
  provision-infra:
    name: "CD · Provision Infrastructure"
    runs-on: [self-hosted, linux, x64]
    needs: [detect-changes, validate]
    if: |
      always() &&
      needs.validate.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.any_change == 'true'
      )
    env:
      INFRA_DIR: ${{ vars.INFRA_DIR    || '' }}
      SOURCE_DIR: ${{ vars.SOURCE_DIR   || '' }}
      DOCKER_DIR: ${{ vars.DOCKER_DIR   || '' }}
      WEBUI_DIR: ${{ vars.WEBUI_DIR    || '' }}
      GTP5G_DIR: ${{ vars.GTP5G_DIR    || '' }}
      UPF_DIR: ${{ vars.UPF_DIR      || '' }}
      STORMSIM_DIR: ${{ vars.STORMSIM_DIR || '' }}
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
      image_owner: ${{ steps.vars.outputs.owner }}
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Resolve paths
        shell: bash
        run: |
          echo "INFRA_DIR=${INFRA_DIR:-$HOME/5gcore-deploy}"               >> $GITHUB_ENV
          echo "SOURCE_DIR=${SOURCE_DIR:-$HOME/Downloads/etrib5gc}"        >> $GITHUB_ENV
          echo "DOCKER_DIR=${DOCKER_DIR:-$HOME/Downloads/etrib5gc/docker}" >> $GITHUB_ENV
          echo "WEBUI_DIR=${WEBUI_DIR:-$HOME/Downloads/5gc-webui}"         >> $GITHUB_ENV
          echo "GTP5G_DIR=${GTP5G_DIR:-$HOME/gtp5g}"                       >> $GITHUB_ENV
          echo "UPF_DIR=${UPF_DIR:-$HOME/Downloads/etrib5gc}"              >> $GITHUB_ENV
          echo "STORMSIM_DIR=${STORMSIM_DIR:-$HOME/Downloads/stormsim}"    >> $GITHUB_ENV

      - name: Resolve image tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            OWNER="${{ inputs.image_owner }}"
            if [ "${{ inputs.image_tag }}" = "latest" ]; then
              TAG="manual-$(date +%Y%m%d-%H%M%S)"
            else
              TAG="${{ inputs.image_tag }}"
            fi
          else
            OWNER="ninhduyhieu"
            TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}"     >> $GITHUB_OUTPUT

      - name: Verify required tools and source
        shell: bash
        run: |
          set -e
          vagrant --version && ansible --version
          docker --version  && kubectl version --client && helm version
          test -d "$INFRA_DIR" && test -d "$DOCKER_DIR"
          test -f "$DOCKER_DIR/nf.Dockerfile"
          test -f "$DOCKER_DIR/copybuild.sh"

      # ── PROVISION ────────────────────────────────────────
      - name: "[Provision] Vagrant up"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_provision == 'true'
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"
          for vm in k3s-server-1 k3s-agent-1 k3s-agent-2; do
            state=$(vagrant status $vm 2>/dev/null | grep -E "^$vm " | awk '{print $2}')
            echo "Current state of $vm: '${state:-not_created}'"
            if [ "$state" = "aborted" ]; then
              vagrant halt $vm --force || true
            fi
          done
          vagrant up --no-parallel

      - name: "[Provision] Wait for SSH"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_provision == 'true'
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"
          for i in {1..40}; do
            ansible -i inventory/hosts.yaml all -m ping >/dev/null 2>&1 \
              && echo "✓ All nodes reachable" && exit 0
            echo "Waiting... $i/40"; sleep 15
          done; exit 1

      # ── GIẢI PHÓNG APT LOCK CHỐNG KẸT ANSIBLE ──────────────
      - name: "[Fix] Force release APT lock on target VMs"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_ansible == 'true'
        shell: bash
        run: |
          cd "$INFRA_DIR"
          echo "Cưỡng bức giải phóng file lock của hệ thống APT để tránh kẹt Ansible..."
          for vm in k3s-server-1 k3s-agent-1 k3s-agent-2; do
            echo "Clearing APT lock on $vm..."
            vagrant ssh $vm -c "sudo killall -9 apt-get apt dpkg 2>/dev/null || true; sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/lib/dpkg/lock" || true
          done

      # ── ANSIBLE ──────────────────────────────────────────
      - name: "[Ansible] Run playbook with retry"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_ansible == 'true'
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"
          ansible-playbook -i inventory/hosts.yaml playbook.yml || {
            sleep 20
            ansible-playbook -i inventory/hosts.yaml playbook.yml
          }

      # ── ÉP CARD MẠNG ETH1 CHO CALICO ĐỂ NODE READY ────────
      - name: "[Fix] Configure Calico Network Interface to eth1"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_ansible == 'true'
        shell: bash
        run: |
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          echo "Ép cấu hình Calico sử dụng đúng card mạng nội bộ eth1 của Vagrant..."
          kubectl set env daemonset/calico-node -n kube-system IP_AUTODETECTION_METHOD=interface=eth1 || true

      - name: "[Ansible] Verify cluster"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_ansible == 'true'
        shell: bash
        run: |
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          kubectl get nodes -o wide

  # ════════════════════════════════════════════════════
  # JOB 3 · CI: TEST (dry-run) — Chạy trước khi deploy
  # ════════════════════════════════════════════════════
  pre-deploy-test:
    name: "CI · Pre-deploy test (dry-run on cluster)"
    runs-on: [self-hosted, linux, x64]
    needs:
      - detect-changes
      - validate
      - provision-infra
    if: |
      always() &&
      needs.provision-infra.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.need_deploy == 'true'
      )
    env:
      INFRA_DIR: ${{ vars.INFRA_DIR || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve paths
        shell: bash
        run: |
          echo "INFRA_DIR=${INFRA_DIR:-$HOME/5gcore-deploy}" >> $GITHUB_ENV
          echo "KUBECONFIG=${INFRA_DIR:-$HOME/5gcore-deploy}/kubeconfig" >> $GITHUB_ENV

      # Bản vá: Đếm tổng số node và số lượng Ready thực tế không dính lỗi cú pháp
      - name: "[Pre-test 1] Wait for cluster nodes to be Ready"
        shell: bash
        run: |
          set -e
          echo "Checking cluster node status..."
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          
          for i in {1..25}; do
            TOTAL_NODES=$(kubectl get nodes --no-headers 2>/dev/null | wc -l || echo "0")
            READY_NODES=$(kubectl get nodes --no-headers 2>/dev/null | grep -E "\bReady\b" | wc -l || echo "0")
            
            echo "Waiting for all nodes to become Ready... ($i/25) - Total registered: $TOTAL_NODES, Ready: $READY_NODES"
            
            if [ "$TOTAL_NODES" -ge 3 ] && [ "$READY_NODES" -eq "$TOTAL_NODES" ]; then
              echo "✓ All $TOTAL_NODES nodes are successfully Ready!"
              kubectl get nodes -o wide
              exit 0
            fi
            sleep 12
          done

          echo "✗ Timeout: Cluster nodes are not completely Ready."
          kubectl get nodes -o wide
          kubectl get pods -n kube-system
          exit 1

      - name: "[Pre-test 2] Validate nodeSelector against real nodes"
        shell: bash
        run: |
          set -e
          FAILED=0
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          REAL_NODES=$(kubectl get nodes --no-headers -o custom-columns=NAME:.metadata.name)
          DECLARED=$(grep -rh "kubernetes.io/hostname:" k8s/ | awk '{print $2}' | sort -u)
          for node in $DECLARED; do
            if echo "$REAL_NODES" | grep -q "^${node}$"; then
              echo "✓ $node exists in cluster"
            else
              echo "✗ $node declared in manifest but NOT found in cluster"
              FAILED=$((FAILED+1))
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1

      - name: "[Pre-test 3] Dry-run apply all manifests on real cluster"
        shell: bash
        run: |
          set -e
          FAILED=0
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          
          # Đảm bảo namespace chính etri6g tồn tại để server dry-run kiểm tra được tuyển tập tài nguyên
          kubectl create namespace etri6g --dry-run=client -o yaml | kubectl apply -f -

          for f in k8s/ctrl.yaml k8s/gw.yaml k8s/nsm.yaml \
                   k8s/mongo.yaml k8s/deploy-other.yaml k8s/pran.yaml; do
            # Đổi target sang namespace chính 'etri6g' để trùng khớp với nội dung file yaml
            if kubectl apply --server-side --dry-run=server \
                --namespace=etri6g -f "$f" 2>&1; then
              echo "✓ $f OK"
            else
              echo "✗ $f FAILED dry-run"
              FAILED=$((FAILED+1))
            fi
          done

          [ "$FAILED" -eq 0 ] || exit 1

      - name: "[Pre-test 4] Check NodePorts not conflicting"
        shell: bash
        run: |
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          MASTER_IP="192.168.58.11"
          for port in 30007 30008 30500; do
            SVC=$(kubectl get svc -A --no-headers \
              | awk -v p="$port" '$0 ~ p {print $2}' | head -1)
            if [ -n "$SVC" ]; then
              echo "✓ Port $port đang được dùng bởi: $SVC"
            else
              echo "ℹ Port $port chưa bị chiếm."
            fi
          done

  # ════════════════════════════════════════════════════
  # JOB 4 · CD: BUILD AND DEPLOY
  # ════════════════════════════════════════════════════
  build-deploy:
    name: "CD · Build and Deploy"
    runs-on: [self-hosted, linux, x64]
    needs:
      - detect-changes
      - pre-deploy-test
    if: |
      always() &&
      needs.pre-deploy-test.result == 'success'
    env:
      INFRA_DIR: ${{ vars.INFRA_DIR    || '' }}
      SOURCE_DIR: ${{ vars.SOURCE_DIR   || '' }}
      DOCKER_DIR: ${{ vars.DOCKER_DIR   || '' }}
      WEBUI_DIR: ${{ vars.WEBUI_DIR    || '' }}
      GTP5G_DIR: ${{ vars.GTP5G_DIR    || '' }}
      UPF_DIR: ${{ vars.UPF_DIR      || '' }}
      STORMSIM_DIR: ${{ vars.STORMSIM_DIR || '' }}
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            OWNER="${{ inputs.image_owner }}"
            if [ "${{ inputs.image_tag }}" = "latest" ]; then
              TAG="manual-$(date +%Y%m%d-%H%M%S)"
            else
              TAG="${{ inputs.image_tag }}"
            fi
          else
            OWNER="ninhduyhieu"
            TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}"     >> $GITHUB_OUTPUT

      - name: Verify required tools and source
        shell: bash
        run: |
          # 1. Bổ sung các đường dẫn cài đặt phổ biến vào PATH của Runner
          export PATH="$PATH:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.local/bin"
          
          FAILED=0

          echo "=== 1. CHECKING SYSTEM TOOLS ==="
          if ! command -v vagrant &> /dev/null; then 
            echo "✗ LỖI: Không tìm thấy lệnh 'vagrant'. Hãy đảm bảo Vagrant đã được cài global hoặc thêm vào PATH."; FAILED=$((FAILED+1))
          else 
            echo "✓ vagrant: $(vagrant --version | head -n1)"
          fi

          if ! command -v ansible &> /dev/null; then 
            echo "✗ LỖI: Không tìm thấy lệnh 'ansible'. Hoặc user runner không có quyền thực thi."; FAILED=$((FAILED+1))
          else 
            echo "✓ ansible: $(ansible --version | head -n1)"
          fi

          if ! command -v docker &> /dev/null; then echo "✗ docker is MISSING"; FAILED=$((FAILED+1)); else echo "✓ docker: $(docker --version | head -n1)"; fi
          if ! command -v kubectl &> /dev/null; then echo "✗ kubectl is MISSING"; FAILED=$((FAILED+1)); else echo "✓ kubectl: $(kubectl version --client --output=yaml | grep gitVersion || echo 'installed')"; fi
          if ! command -v helm &> /dev/null; then echo "✗ helm is MISSING"; FAILED=$((FAILED+1)); else echo "✓ helm: $(helm version --short)"; fi

          echo "=== 2. CHECKING PATHS & PERMISSIONS ==="
          echo "INFRA_DIR target: $INFRA_DIR"
          if [ ! -d "$INFRA_DIR" ]; then echo "✗ INFRA_DIR không tồn tại hoặc Runner không có quyền đọc"; FAILED=$((FAILED+1)); else echo "✓ INFRA_DIR exists"; fi
          
          echo "DOCKER_DIR target: $DOCKER_DIR"
          if [ ! -d "$DOCKER_DIR" ]; then echo "✗ DOCKER_DIR không tồn tại hoặc Runner không có quyền đọc"; FAILED=$((FAILED+1)); else echo "✓ DOCKER_DIR exists"; fi

          echo "=== 3. CHECKING FILES ==="
          if [ ! -f "$DOCKER_DIR/nf.Dockerfile" ]; then echo "✗ Không tìm thấy file: nf.Dockerfile"; FAILED=$((FAILED+1)); else echo "✓ nf.Dockerfile found"; fi
          if [ ! -f "$DOCKER_DIR/copybuild.sh" ]; then 
            echo "✗ Không tìm thấy file: copybuild.sh"; FAILED=$((FAILED+1))
          else 
            echo "✓ copybuild.sh found"
            # Cấp thêm quyền thực thi trực tiếp phòng trường hợp file bị lock quyền
            chmod +x "$DOCKER_DIR/copybuild.sh" || true
          fi

          if [ "$FAILED" -gt 0 ]; then
            echo "--------------------------------------------------------"
            echo "🔥 Pipeline dừng lại vì phát hiện $FAILED lỗi cấu hình môi trường bên trên!"
            exit 1
          fi
          echo "🎉 Tất cả điều kiện hợp lệ! Tiếp tục build..."

      # ── BUILD ─────────────────────────────────────────────
      - name: "[Build] Login to GHCR"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "[Build] Prepare build context"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_build == 'true'
        shell: bash
        run: |
          set -e; cd "$DOCKER_DIR"
          chmod +x copybuild.sh && ./copybuild.sh

      - name: "[Build] Build and push base image"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_build == 'true'
        shell: bash
        run: |
          set -e; cd "$DOCKER_DIR"
          IMAGE="ghcr.io/${{ steps.vars.outputs.owner }}/b5gc-base"
          TAG="${{ steps.vars.outputs.tag }}"
          docker build --target b5gc-base -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" -f nf.Dockerfile .
          docker push "${IMAGE}:${TAG}" && docker push "${IMAGE}:latest"

      - name: "[Build] Build and push controller"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_build == 'true'
        shell: bash
        run: |
          set -e; cd "$DOCKER_DIR"
          IMAGE="ghcr.io/${{ steps.vars.outputs.owner }}/b5gc-controller"
          TAG="${{ steps.vars.outputs.tag }}"
          docker build --build-arg B5GC_MODULE=controller -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" -f nf.Dockerfile .
          docker push "${IMAGE}:${TAG}" && docker push "${IMAGE}:latest"

      - name: "[Build] Build and push gateway"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_build == 'true'
        shell: bash
        run: |
          set -e; cd "$DOCKER_DIR"
          IMAGE="ghcr.io/${{ steps.vars.outputs.owner }}/b5gc-gateway"
          TAG="${{ steps.vars.outputs.tag }}"
          docker build --build-arg B5GC_MODULE=gateway -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" -f nf.Dockerfile .
          docker push "${IMAGE}:${TAG}" && docker push "${IMAGE}:latest"

      - name: "[Build] Build and push nsm"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_build == 'true'
        shell: bash
        run: |
          set -e; cd "$DOCKER_DIR"
          IMAGE="ghcr.io/${{ steps.vars.outputs.owner }}/b5gc-nsm"
          TAG="${{ steps.vars.outputs.tag }}"
          docker build --build-arg B5GC_MODULE=nsm -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" -f nf.Dockerfile .
          docker push "${IMAGE}:${TAG}" && docker push "${IMAGE}:latest"

      - name: "[Build] Build and push remaining NFs"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_build == 'true'
        shell: bash
        run: |
          set -e; cd "$DOCKER_DIR"
          TAG="${{ steps.vars.outputs.tag }}"
          OWNER="${{ steps.vars.outputs.owner }}"
          for nf in ausf udm pcf damf amf smf pran; do
            IMAGE="ghcr.io/${OWNER}/b5gc-${nf}"
            docker build --build-arg B5GC_MODULE=${nf} -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" -f nf.Dockerfile .
            docker push "${IMAGE}:${TAG}" && docker push "${IMAGE}:latest"
          done

      # ── DEPLOY ────────────────────────────────────────────
      - name: "[Deploy] Ensure namespace etri6g"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_deploy == 'true'
        shell: bash
        run: |
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          kubectl create namespace etri6g --dry-run=client -o yaml | kubectl apply -f -

      - name: "[Deploy] Render manifests"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_deploy == 'true'
        shell: bash
        run: |
          set -e; cd "$INFRA_DIR"
          ./scripts/render-ghcr-images.sh "${{ steps.vars.outputs.owner }}" "${{ steps.vars.outputs.tag }}" rendered

      - name: "[Deploy] Apply manifests in order"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_deploy == 'true'
        shell: bash
        run: |
          set -e
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          cd "$INFRA_DIR"
          kubectl apply -f rendered/ctrl.yaml
          kubectl apply -f rendered/gw.yaml
          kubectl apply -f rendered/nsm.yaml
          kubectl apply -f rendered/mongo.yaml
          kubectl apply -f rendered/deploy-other.yaml
          kubectl apply -f rendered/pran.yaml

      - name: "[Deploy] Wait for rollout"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_deploy == 'true'
        shell: bash
        run: |
          set -e
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          for dep in \
            ctrl-dep gateway-dep nsm-dep damf-dep \
            amf-10-100-agent1-dep amf-10-100-agent2-dep \
            smf-slice1-dep smf-slice2-dep pran-dep; do
            echo "Waiting $dep..."
            kubectl rollout status deployment/$dep -n etri6g --timeout=180s
          done

      # ── MONITORING ────────────────────────────────────────
      - name: "[Monitoring] Helm upgrade Loki + Alloy + Grafana"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_monitoring == 'true'
        shell: bash
        run: |
          set -e
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          kubectl create namespace observability --dry-run=client -o yaml | kubectl apply -f -
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update
          helm upgrade --install loki    grafana/loki    -n observability -f "$INFRA_DIR/observability/loki-values.yaml"    --wait --timeout 3m
          helm upgrade --install alloy   grafana/alloy   -n observability -f "$INFRA_DIR/observability/alloy-values.yaml"   --wait --timeout 2m
          helm upgrade --install grafana grafana/grafana -n observability -f "$INFRA_DIR/observability/grafana-values.yaml" --wait --timeout 2m

      # ── WEBUI ─────────────────────────────────────────────
      - name: "[WebUI] Restart backend"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_deploy == 'true'
        shell: bash
        run: |
          pkill -f "uvicorn server:app" || true; sleep 2
          cd "$WEBUI_DIR/backend"
          export PATH="$PATH:$HOME/.local/bin"
          export PROJECT_DIR="$INFRA_DIR"
          export K8S_NAMESPACE=etri6g
          nohup uvicorn server:app --host 0.0.0.0 --port 8000 > /tmp/webui-backend.log 2>&1 &
          for i in {1..10}; do
            curl -sf http://localhost:8000/api/status >/dev/null 2>&1 && echo "✓ Backend up" && break
            sleep 2
          done

      - name: "[WebUI] Restart frontend"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_deploy == 'true'
        shell: bash
        run: |
          pkill -f "vite" || true; sleep 2
          cd "$WEBUI_DIR/frontend"
          nohup npm run dev > /tmp/webui-frontend.log 2>&1 &
          echo "✓ WebUI frontend started"

  # ════════════════════════════════════════════════════
  # JOB 5 · CD: POST-DEPLOY VERIFY — Đầy đủ các bước verify & rollback sâu
  # ════════════════════════════════════════════════════
  post-deploy-verify:
    name: "CD · Post-deploy verify"
    runs-on: [self-hosted, linux, x64]
    needs:
      - detect-changes
      - build-deploy
    if: |
      always() &&
      needs.build-deploy.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.need_deploy == 'true'
      )
    env:
      INFRA_DIR: ${{ vars.INFRA_DIR || '' }}
    steps:
      - name: Resolve paths
        shell: bash
        run: |
          # Kiểm tra nếu biến rỗng hoặc không tồn tại thì gán cứng đường dẫn mặc định
          [ -z "${{ vars.INFRA_DIR }}" ]  && INFRA_VAL="$HOME/5gcore-deploy"               || INFRA_VAL="${{ vars.INFRA_DIR }}"
          [ -z "${{ vars.SOURCE_DIR }}" ] && SOURCE_VAL="$HOME/Downloads/etrib5gc"        || SOURCE_VAL="${{ vars.SOURCE_DIR }}"
          [ -z "${{ vars.DOCKER_DIR }}" ] && DOCKER_VAL="$HOME/Downloads/etrib5gc/docker" || DOCKER_VAL="${{ vars.DOCKER_DIR }}"
          [ -z "${{ vars.WEBUI_DIR }}" ]  && WEBUI_VAL="$HOME/Downloads/5gc-webui"         || WEBUI_VAL="${{ vars.WEBUI_DIR }}"
          [ -z "${{ vars.GTP5G_DIR }}" ]  && GTP5G_VAL="$HOME/gtp5g"                       || GTP5G_VAL="${{ vars.GTP5G_DIR }}"
          [ -z "${{ vars.UPF_DIR }}" ]    && UPF_VAL="$HOME/Downloads/etrib5gc"            || UPF_VAL="${{ vars.UPF_DIR }}"
          [ -z "${{ vars.STORMSIM_DIR }}" ] && STORMSIM_VAL="$HOME/Downloads/stormsim"    || STORMSIM_VAL="${{ vars.STORMSIM_DIR }}"

          # Đẩy các giá trị chuẩn xác này vào GITHUB_ENV cho các bước sau sử dụng
          echo "INFRA_DIR=$INFRA_VAL"       >> $GITHUB_ENV
          echo "SOURCE_DIR=$SOURCE_VAL"     >> $GITHUB_ENV
          echo "DOCKER_DIR=$DOCKER_VAL"     >> $GITHUB_ENV
          echo "WEBUI_DIR=$WEBUI_VAL"       >> $GITHUB_ENV
          echo "GTP5G_DIR=$GTP5G_VAL"       >> $GITHUB_ENV
          echo "UPF_DIR=$UPF_VAL"           >> $GITHUB_ENV
          echo "STORMSIM_DIR=$STORMSIM_VAL" >> $GITHUB_ENV
          echo "KUBECONFIG=$INFRA_VAL/kubeconfig" >> $GITHUB_ENV

      - name: "[Verify 1] All NF pods Running"
        id: verify_pods
        shell: bash
        run: |
          set -e
          FAILED=0
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          DEPS=(ctrl-dep gateway-dep nsm-dep ausf-dep udm-dep pcf-dep damf-dep amf-10-100-agent1-dep amf-10-100-agent2-dep smf-slice1-dep smf-slice2-dep pran-dep)
          for dep in "${DEPS[@]}"; do
            READY=$(kubectl get deployment/$dep -n etri6g -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
            if [ "${READY:-0}" -ge 1 ]; then
              echo "✓ $dep: Ready"
            else
              echo "✗ $dep: NOT ready"
              FAILED=$((FAILED+1))
            fi
          done
          kubectl get pods -n etri6g -o wide
          [ "$FAILED" -eq 0 ] || exit 1

      - name: "[Verify 2] NF placement on correct nodes"
        id: verify_placement
        shell: bash
        run: |
          set -e
          FAILED=0
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          check() {
            local label=$1 expected=$2
            actual=$(kubectl get pods -n etri6g -l "app=${label}" --no-headers -o wide 2>/dev/null | awk '{print $7}' | head -1)
            if [ "$actual" = "$expected" ]; then
              echo "✓ $label → $actual"
            else
              echo "✗ $label: expected=$expected actual=${actual:-NOT_FOUND}"
              FAILED=$((FAILED+1))
            fi
          }
          check ctrl     k3s-agent-1
          check gateway  k3s-agent-1
          check nsm      k3s-agent-1
          check ausf     k3s-agent-1
          check udm      k3s-agent-1
          check pcf      k3s-agent-1
          check damf     k3s-agent-1
          check amf      k3s-agent-1
          check smf-slice2 k3s-agent-2
          check pran     k3s-server-1
          [ "$FAILED" -eq 0 ] || exit 1

      - name: "[Verify 3] NodePort reachable"
        id: verify_nodeport
        shell: bash
        run: |
          MASTER_IP="192.168.58.11"
          FAILED=0
          check_port() {
            local name=$1 port=$2
            if nc -z -w3 "$MASTER_IP" "$port" 2>/dev/null; then
              echo "✓ $name :$port reachable"
            else
              echo "✗ $name :$port NOT reachable"
              FAILED=$((FAILED+1))
            fi
          }
          check_port "Controller API" 30008
          check_port "Gateway"        30007
          check_port "PRAN"           30500
          [ "$FAILED" -eq 0 ] || exit 1

      - name: "[Verify 4] Gateway log — NFs registered in mesh"
        id: verify_mesh
        shell: bash
        run: |
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          GW_POD=$(kubectl get pods -n etri6g -l app=gateway --no-headers | awk '{print $1}' | head -1)
          echo "Gateway pod: $GW_POD"
          echo "=== Gateway log (tail 30) ==="
          kubectl logs "$GW_POD" -n etri6g --tail=30 2>/dev/null || true

      - name: "[Rollback] kubectl rollout undo nếu verify fail"
        if: |
          failure() && (
            steps.verify_pods.outcome == 'failure' ||
            steps.verify_placement.outcome == 'failure' ||
            steps.verify_nodeport.outcome == 'failure'
          )
        shell: bash
        run: |
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          echo "⚠ Verify failed — rolling back all deployments..."
          for dep in \
            ctrl-dep gateway-dep nsm-dep damf-dep \
            amf-10-100-agent1-dep amf-10-100-agent2-dep \
            smf-slice1-dep smf-slice2-dep pran-dep; do
            kubectl rollout undo deployment/$dep -n etri6g 2>/dev/null && echo "↩ Rolled back $dep" || echo "⚠ Skip $dep"
          done

  # ════════════════════════════════════════════════════
  # JOB 6 · NOTIFY — kết quả cuối cùng
  # ════════════════════════════════════════════════════
  notify:
    name: "Notify result"
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - validate
      - pre-deploy-test
      - build-deploy
      - post-deploy-verify
    if: always()
    steps:
      - name: Summary
        shell: bash
        run: |
          echo "========================================"
          echo "Pipeline Result"
          echo "  Branch  : ${{ github.ref_name }}"
          echo "  Commit  : ${{ github.sha }}"
          echo "----------------------------------------"
          echo "  validate        : ${{ needs.validate.result }}"
          echo "  provision       : ${{ needs.provision-infra.result }}"
          echo "  pre-deploy-test : ${{ needs.pre-deploy-test.result }}"
          echo "  deploy          : ${{ needs.build-deploy.result }}"
          echo "  post-verify     : ${{ needs.post-deploy-verify.result }}"
          echo "========================================"
          
          if [ "${{ needs.validate.result }}" = "failure" ] || \
             [ "${{ needs.provision-infra.result }}" = "failure" ] || \
             [ "${{ needs.pre-deploy-test.result }}" = "failure" ] || \
             [ "${{ needs.build-deploy.result }}" = "failure" ] || \
             [ "${{ needs.post-deploy-verify.result }}" = "failure" ]; then
            exit 1
          fi