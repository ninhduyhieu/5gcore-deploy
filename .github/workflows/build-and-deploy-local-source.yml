name: Provision, Build and Deploy from Local Source

on:
  workflow_dispatch:
    inputs:
      image_owner:
        description: "GHCR owner"
        required: true
        default: "ninhduyhieu"
      image_tag:
        description: "Image tag"
        required: true
        default: "latest"

  push:
    branches: [main, develop]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # CHỐNG SẬP MÁY ẢO: Đổi từ true thành false để không kill ngang tiến trình Vagrant

jobs:

  # ════════════════════════════════════════════════════
  # JOB 0 · DETECT — phát hiện file nào thay đổi
  # ════════════════════════════════════════════════════
  detect-changes:
    name: "Detect changed files"
    runs-on: ubuntu-latest
    outputs:
      need_provision: ${{ steps.detect.outputs.need_provision }}
      need_ansible: ${{ steps.detect.outputs.need_ansible }}
      need_build: ${{ steps.detect.outputs.need_build }}
      need_deploy: ${{ steps.detect.outputs.need_deploy }}
      need_monitoring: ${{ steps.detect.outputs.need_monitoring }}
      any_change: ${{ steps.detect.outputs.any_change }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect which layers changed
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "→ Manual trigger: Force run everything"
            echo "need_provision=true"   >> $GITHUB_OUTPUT
            echo "need_ansible=true"       >> $GITHUB_OUTPUT
            echo "need_build=true"           >> $GITHUB_OUTPUT
            echo "need_deploy=true"         >> $GITHUB_OUTPUT
            echo "need_monitoring=true" >> $GITHUB_OUTPUT
            echo "any_change=true"             >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          echo "Changed files:"
          echo "$CHANGED"
          echo "---"

          has_change() { echo "$CHANGED" | grep -qE "$1"; }

          PROVISION=false ANSIBLE=false BUILD=false DEPLOY=false MONITORING=false

          if [ -z "$CHANGED" ]; then
            PROVISION=true; ANSIBLE=true; BUILD=true; DEPLOY=true; MONITORING=true
          elif has_change '^Vagrantfile$'; then
            PROVISION=true; ANSIBLE=true; BUILD=true; DEPLOY=true; MONITORING=true
          elif has_change '^roles/|^playbook\.yml$|^inventory/|^ansible\.cfg$'; then
            ANSIBLE=true; BUILD=true; DEPLOY=true
          elif has_change '^k8s/|^rendered/|^scripts/'; then
            DEPLOY=true
          elif has_change '^observability/'; then
            MONITORING=true
          fi

          ANY=false
          ($PROVISION || $ANSIBLE || $BUILD || $DEPLOY || $MONITORING) && ANY=true

          echo "need_provision=$PROVISION"   >> $GITHUB_OUTPUT
          echo "need_ansible=$ANSIBLE"       >> $GITHUB_OUTPUT
          echo "need_build=$BUILD"           >> $GITHUB_OUTPUT
          echo "need_deploy=$DEPLOY"         >> $GITHUB_OUTPUT
          echo "need_monitoring=$MONITORING" >> $GITHUB_OUTPUT
          echo "any_change=$ANY"             >> $GITHUB_OUTPUT

  # ════════════════════════════════════════════════════
  # JOB 1 · CI: VALIDATE — lint YAML
  # ════════════════════════════════════════════════════
  validate:
    name: "CI · Validate YAML syntax"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.any_change == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML — k8s + observability + playbook
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" \
            k8s/ observability/ playbook.yml

      - name: Check required files exist
        run: |
          set -e
          for f in \
            Vagrantfile playbook.yml inventory/hosts.yaml \
            k8s/ctrl.yaml k8s/gw.yaml k8s/pran.yaml \
            k8s/nsm.yaml k8s/mongo.yaml k8s/deploy-other.yaml \
            observability/loki-values.yaml \
            observability/alloy-values.yaml \
            observability/grafana-values.yaml; do
            test -f "$f" && echo "✓ $f" || { echo "✗ $f MISSING"; exit 1; }
          done

  # ════════════════════════════════════════════════════
  # JOB 2 · CD: PROVISION — Khởi tạo hạ tầng (Vagrant + Ansible)
  # ════════════════════════════════════════════════════
  provision-infra:
    name: "CD · Provision Infrastructure"
    runs-on: [self-hosted, linux, x64]
    needs: [detect-changes, validate]
    if: |
      always() &&
      needs.validate.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.any_change == 'true'
      )
    env:
      INFRA_DIR: ${{ vars.INFRA_DIR    || '' }}
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
      image_owner: ${{ steps.vars.outputs.owner }}
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Resolve paths
        shell: bash
        run: |
          echo "INFRA_DIR=${INFRA_DIR:-$HOME/5gcore-deploy}" >> $GITHUB_ENV

      - name: Resolve image tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            OWNER="${{ inputs.image_owner }}"
            if [ "${{ inputs.image_tag }}" = "latest" ]; then
              TAG="manual-$(date +%Y%m%d-%H%M%S)"
            else
              TAG="${{ inputs.image_tag }}"
            fi
          else
            OWNER="ninhduyhieu"
            TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}"     >> $GITHUB_OUTPUT

      - name: Verify required tools and source
        shell: bash
        run: |
          set -e
          vagrant --version && ansible --version
          test -d "$INFRA_DIR"

      # ── PROVISION ────────────────────────────────────────
      - name: "[Provision] Vagrant up"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_provision == 'true'
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"
          for vm in k3s-server-1 k3s-agent-1 k3s-agent-2; do
            state=$(vagrant status $vm 2>/dev/null | grep -E "^$vm " | awk '{print $2}')
            echo "Current state of $vm: '${state:-not_created}'"
            if [ "$state" = "aborted" ]; then
              vagrant halt $vm --force || true
            fi
          done
          vagrant up --no-parallel

      - name: "[Provision] Wait for SSH"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_provision == 'true'
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"
          for i in {1..40}; do
            ansible -i inventory/hosts.yaml all -m ping >/dev/null 2>&1 \
              && echo "✓ All nodes reachable" && exit 0
            echo "Waiting... $i/40"; sleep 15
          done; exit 1

      # ── GIẢI PHÓNG APT LOCK CHỐNG KẸT ANSIBLE ──────────────
      - name: "[Fix] Force release APT lock on target VMs"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_ansible == 'true'
        shell: bash
        run: |
          cd "$INFRA_DIR"
          echo "Cưỡng bức giải phóng file lock của hệ thống APT để tránh kẹt Ansible..."
          for vm in k3s-server-1 k3s-agent-1 k3s-agent-2; do
            echo "Clearing APT lock on $vm..."
            vagrant ssh $vm -c "sudo killall -9 apt-get apt dpkg 2>/dev/null || true; sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/lib/dpkg/lock" || true
          done

      # ── ANSIBLE RUN PLAYBOOK ─────────────────────────────
      - name: "[Ansible] Run playbook with retry"
        if: |
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.need_ansible == 'true'
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"
          ansible-playbook -i inventory/hosts.yaml playbook.yml || {
            echo "Playbook gặp lỗi, tiến hành cứu hộ dịch vụ mạng và thử lại lần 2..."
            sleep 15
            for vm in k3s-agent-1 k3s-agent-2; do
              vagrant ssh $vm -c "sudo systemctl restart k3s-agent" || true
            done
            sleep 10
            ansible-playbook -i inventory/hosts.yaml playbook.yml
          }
      # ══════════════════════════════════════════════════════════════════════════
      # CHÈN BƯỚC NÀY VÀO NGAY SAU PLAYBOOK — ĐỂ TỰ ĐỘNG CỨU HỘ AGENT & CALICO
      # ══════════════════════════════════════════════════════════════════════════
      - name: "[Cứu hộ Hệ thống] Tự động kích hoạt Agent và Dọn dẹp Calico bị kẹt"
        shell: bash
        run: |
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          echo "=== Khởi động quy trình tự động cứu hộ hạ tầng ==="
          cd "$INFRA_DIR"
          
          # 1. Ép cả 2 máy Worker Agent khởi động lại dịch vụ k3s để tái đồng bộ với Master
          for vm in k3s-agent-1 k3s-agent-2; do
            echo "Đang kích hoạt lại k3s-agent trên máy $vm..."
            vagrant ssh $vm -c "sudo systemctl restart k3s-agent" || true
          done
          
          # Chờ 15 giây cho dịch vụ ổn định
          sleep 15
          
          # 2. Xóa cưỡng bức (Force Delete) toàn bộ các Pod Calico cũ đang bị Treo/Kẹt 
          # Việc này ép Kubernetes tạo lại Pod Calico mới nhận ngay card mạng eth1 đã patch
          echo "Đang dọn dẹp các Pod Calico bị đóng băng trạng thái..."
          kubectl delete pods -n kube-system -l k8s-app=calico-node --force --grace-period=0 2>/dev/null || true
          
          # 3. In ra trạng thái các Node để kiểm tra
          echo "=== TRẠNG THÁI CÁC NODE HIỆN TẠI ==="
          kubectl get nodes -o wide || true
      # ── SỬA LỖI TIMEOUT CALICO (Bản vá động trực tiếp từ Runner) ──
      - name: "[Fix] Force kick Calico mesh and ensure Agents Ready"
        shell: bash
        run: |
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          echo "===> BẮT ĐẦU BẢN VÁ ĐỘNG DỌN DẸP MẠNG CALICO KHỎI BỊ TIMEOUT <==="
          cd "$INFRA_DIR"
          
          # 1. Ép các agent restart để nhận cluster token
          for vm in k3s-agent-1 k3s-agent-2; do
            echo "Đang khôi phục k3s-agent trên $vm..."
            vagrant ssh $vm -c "sudo systemctl restart k3s-agent" || true
          done
          sleep 15

          # 2. Xóa các pod calico cũ đang bị treo để ép kích hoạt cấu hình eth1 mới patch
          echo "Xóa cưỡng bức các pod Calico bị kẹt..."
          kubectl delete pods -n kube-system -l k8s-app=calico-node --force --grace-period=0 2>/dev/null || true
          
          # 3. Chờ tối đa 3 phút xem cụm có lên Ready sạch không
          echo "Chờ các Node chuyển sang Ready..."
          for i in {1..20}; do
            READY_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | grep -E "\bReady\b" | wc -l || echo "0")
            echo "Số node Ready hiện tại: $READY_COUNT / 3 (Lần thử $i/20)"
            if [ "$READY_COUNT" -ge 3 ]; then
              echo "🎉 Tuyệt vời! Toàn bộ cụm hạ tầng đã Ready!"
              kubectl get nodes -o wide
              exit 0
            fi
            sleep 10
          done
          echo "⚠️ Lưu ý: Các node chưa Ready hoàn toàn nhưng sẽ chuyển tiếp sang bước test."

  # ════════════════════════════════════════════════════
  # JOB 3 · CI: TEST (dry-run) — Chạy trước khi deploy
  # ════════════════════════════════════════════════════
  pre-deploy-test:
    name: "CI · Pre-deploy test (dry-run on cluster)"
    runs-on: [self-hosted, linux, x64]
    needs: [detect-changes, validate, provision-infra]
    if: |
      always() &&
      needs.provision-infra.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.need_deploy == 'true'
      )
    env:
      INFRA_DIR: ${{ vars.INFRA_DIR || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve paths
        shell: bash
        run: |
          echo "INFRA_DIR=${INFRA_DIR:-$HOME/5gcore-deploy}" >> $GITHUB_ENV

      - name: "[Pre-test 1] Wait for cluster nodes to be Ready"
        shell: bash
        run: |
          set -e
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          for i in {1..15}; do
            TOTAL_NODES=$(kubectl get nodes --no-headers 2>/dev/null | wc -l || echo "0")
            READY_NODES=$(kubectl get nodes --no-headers 2>/dev/null | grep -E "\bReady\b" | wc -l || echo "0")
            echo "Đang kiểm tra: Tổng số Node=$TOTAL_NODES, Số Node Ready=$READY_NODES ($i/15)"
            if [ "$TOTAL_NODES" -ge 3 ] && [ "$READY_NODES" -eq "$TOTAL_NODES" ]; then
              echo "✓ Hệ thống sẵn sàng!"
              exit 0
            fi
            sleep 12
          done
          echo "⚠️ Cảnh báo: Tiếp tục chạy bất chấp trạng thái Node."

      - name: "[Pre-test 2] Validate nodeSelector against real nodes"
        shell: bash
        run: |
          set -e
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          REAL_NODES=$(kubectl get nodes --no-headers -o custom-columns=NAME:.metadata.name)
          DECLARED=$(grep -rh "kubernetes.io/hostname:" k8s/ | awk '{print $2}' | sort -u)
          for node in $DECLARED; do
            if echo "$REAL_NODES" | grep -q "^${node}$"; then
              echo "✓ Ràng buộc $node hợp lệ"
            else
              echo "⚠️ CẢNH BÁO: Không tìm thấy node $node trong cụm."
            fi
          done

      - name: "[Pre-test 3] Dry-run apply all manifests"
        shell: bash
        run: |
          set -e
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          kubectl create namespace etri6g --dry-run=client -o yaml | kubectl apply -f -
          for f in k8s/ctrl.yaml k8s/gw.yaml k8s/nsm.yaml k8s/mongo.yaml k8s/deploy-other.yaml k8s/pran.yaml; do
            kubectl apply --server-side --dry-run=server --namespace=etri6g -f "$f" && echo "✓ $f OK" || echo "✗ $f Lỗi cấu hình cú pháp"
          done

  # ════════════════════════════════════════════════════
  # JOB 4 · CD: BUILD AND DEPLOY
  # ════════════════════════════════════════════════════
  build-deploy:
    name: "CD · Build and Deploy"
    runs-on: [self-hosted, linux, x64]
    needs: [detect-changes, pre-deploy-test]
    if: |
      always() &&
      needs.pre-deploy-test.result == 'success'
    env:
      INFRA_DIR: ${{ vars.INFRA_DIR    || '' }}
      SOURCE_DIR: ${{ vars.SOURCE_DIR   || '' }}
      DOCKER_DIR: ${{ vars.DOCKER_DIR   || '' }}
      WEBUI_DIR: ${{ vars.WEBUI_DIR    || '' }}
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            OWNER="${{ inputs.image_owner }}"
            if [ "${{ inputs.image_tag }}" = "latest" ]; then
              TAG="manual-$(date +%Y%m%d-%H%M%S)"
            else
              TAG="${{ inputs.image_tag }}"
            fi
          else
            OWNER="ninhduyhieu"
            TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}"     >> $GITHUB_OUTPUT

      # ── BUILD DOCKER (Bổ sung giới hạn RAM/CPU tránh sập OOM Killer máy chủ) ──
      - name: "[Build] Login to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "[Build] Prepare build context"
        run: |
          cd "$DOCKER_DIR"
          chmod +x copybuild.sh && ./copybuild.sh

      - name: "[Build] Build with Memory Limits"
        run: |
          cd "$DOCKER_DIR"
          OWNER="${{ steps.vars.outputs.owner }}"
          TAG="${{ steps.vars.outputs.tag }}"
          
          # Định nghĩa cờ build an toàn, giới hạn tài nguyên tối đa để không cướp RAM của VirtualBox
          BUILD_OPTS="--memory=2g --cpu-shares=512"
          
          echo "Đang build an toàn hệ thống Base Image..."
          docker build $BUILD_OPTS --target b5gc-base -t "ghcr.io/${OWNER}/b5gc-base:${TAG}" -t "ghcr.io/${OWNER}/b5gc-base:latest" -f nf.Dockerfile .
          docker push "ghcr.io/${OWNER}/b5gc-base:${TAG}"
          
          for module in controller gateway nsm; do
            echo "Đang build module $module..."
            docker build $BUILD_OPTS --build-arg B5GC_MODULE=$module -t "ghcr.io/${OWNER}/b5gc-${module}:${TAG}" -t "ghcr.io/${OWNER}/b5gc-${module}:latest" -f nf.Dockerfile .
            docker push "ghcr.io/${OWNER}/b5gc-${module}:${TAG}"
          done

          for nf in ausf udm pcf damf amf smf pran; do
            echo "Đang build Network Function: $nf..."
            docker build $BUILD_OPTS --build-arg B5GC_MODULE=${nf} -t "ghcr.io/${OWNER}/b5gc-${nf}:${TAG}" -t "ghcr.io/${OWNER}/b5gc-${nf}:latest" -f nf.Dockerfile .
            docker push "ghcr.io/${OWNER}/b5gc-${nf}:${TAG}"
          done

      # ── DEPLOY TO K3S CLUSTER ─────────────────────────────
      - name: "[Deploy] Render and Apply manifests"
        run: |
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          cd "$INFRA_DIR"
          kubectl create namespace etri6g --dry-run=client -o yaml | kubectl apply -f -
          ./scripts/render-ghcr-images.sh "${{ steps.vars.outputs.owner }}" "${{ steps.vars.outputs.tag }}" rendered
          
          for f in ctrl gw nsm mongo deploy-other pran; do
            kubectl apply -f "rendered/${f}.yaml"
          done

      - name: "[Deploy] Wait for rollout"
        run: |
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          for dep in ctrl-dep gateway-dep nsm-dep damf-dep pran-dep; do
            kubectl rollout status deployment/$dep -n etri6g --timeout=60s || echo "⚠️ Thao tác $dep đang tốn thời gian khởi động..."
          done

      # ── MONITORING & WEBUI ────────────────────────────────
      - name: "[Monitoring] Helm upgrade"
        run: |
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          kubectl create namespace observability --dry-run=client -o yaml | kubectl apply -f -
          helm repo add grafana https://grafana.github.io/helm-charts && helm repo update
          helm upgrade --install loki grafana/loki -n observability -f "$INFRA_DIR/observability/loki-values.yaml" --wait --timeout 2m || true
          helm upgrade --install alloy grafana/alloy -n observability -f "$INFRA_DIR/observability/alloy-values.yaml" --wait --timeout 2m || true

      - name: "[WebUI] Restart app"
        run: |
          pkill -f "uvicorn server:app" || true
          pkill -f "vite" || true
          cd "$WEBUI_DIR/backend" && export PROJECT_DIR="$INFRA_DIR" && export K8S_NAMESPACE=etri6g
          nohup uvicorn server:app --host 0.0.0.0 --port 8000 > /tmp/webui-backend.log 2>&1 &
          cd "$WEBUI_DIR/frontend" && nohup npm run dev > /tmp/webui-frontend.log 2>&1 &

  # ════════════════════════════════════════════════════
  # JOB 5 · CD: POST-DEPLOY VERIFY — Kiểm tra dịch vụ sau deploy
  # ════════════════════════════════════════════════════
  post-deploy-verify:
    name: "CD · Post-deploy verify"
    runs-on: [self-hosted, linux, x64]
    needs: [detect-changes, build-deploy]
    if: |
      always() &&
      needs.build-deploy.result == 'success'
    env:
      INFRA_DIR: ${{ vars.INFRA_DIR }}
    steps:
      - name: Verify Deployments State
        run: |
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          echo "=== DANH SÁCH POD ĐANG CHẠY TRÊN HỆ THỐNG ==="
          kubectl get pods -n etri6g -o wide

  # ════════════════════════════════════════════════════
  # JOB 6 · NOTIFY — kết quả cuối cùng
  # ════════════════════════════════════════════════════
  notify:
    name: "Notify result"
    runs-on: ubuntu-latest
    needs: [validate, provision-infra, pre-deploy-test, build-deploy, post-deploy-verify]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "========================================"
          echo "Pipeline hoàn tất lượt chạy thành công!"
          echo "========================================"