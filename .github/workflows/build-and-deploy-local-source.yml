name: Provision, Build and Deploy from Local Source

on:
  workflow_dispatch:
    inputs:
      image_owner:
        description: "GHCR owner"
        required: true
        default: "ninhduyhieu"
      image_tag:
        description: "Image tag"
        required: true
        default: "latest"

jobs:
  provision-build-deploy:
    runs-on: [self-hosted, linux, x64]

    env:
      INFRA_DIR:    ${{ vars.INFRA_DIR    || '' }}
      SOURCE_DIR:   ${{ vars.SOURCE_DIR   || '' }}
      DOCKER_DIR:   ${{ vars.DOCKER_DIR   || '' }}
      WEBUI_DIR:    ${{ vars.WEBUI_DIR    || '' }}
      GTP5G_DIR:    ${{ vars.GTP5G_DIR    || '' }}
      UPF_DIR:      ${{ vars.UPF_DIR      || '' }}
      STORMSIM_DIR: ${{ vars.STORMSIM_DIR || '' }}

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Resolve paths
        shell: bash
        run: |
          # Resolve $HOME-based defaults nếu vars.* chưa được set
          echo "INFRA_DIR=${INFRA_DIR:-$HOME/5gcore-deploy}"       >> $GITHUB_ENV
          echo "SOURCE_DIR=${SOURCE_DIR:-$HOME/Downloads/etrib5gc}" >> $GITHUB_ENV
          echo "DOCKER_DIR=${DOCKER_DIR:-$HOME/Downloads/etrib5gc/docker}" >> $GITHUB_ENV
          echo "WEBUI_DIR=${WEBUI_DIR:-$HOME/Downloads/5gc-webui}" >> $GITHUB_ENV
          echo "GTP5G_DIR=${GTP5G_DIR:-$HOME/gtp5g}"               >> $GITHUB_ENV
          echo "UPF_DIR=${UPF_DIR:-$HOME/Downloads/etrib5gc}"      >> $GITHUB_ENV
          echo "STORMSIM_DIR=${STORMSIM_DIR:-$HOME/Downloads/stormsim}" >> $GITHUB_ENV

      - name: Verify required tools and local source
        shell: bash
        run: |
          set -e
          vagrant --version
          ansible --version
          docker --version
          kubectl version --client
          helm version
          test -d "$INFRA_DIR"
          test -d "$SOURCE_DIR"
          test -d "$DOCKER_DIR"
          test -f "$DOCKER_DIR/nf.Dockerfile"
          test -f "$DOCKER_DIR/copybuild.sh"
          test -f "$DOCKER_DIR/Makefile"
          ls -la "$SOURCE_DIR"
          ls -la "$DOCKER_DIR"

      - name: Provision VMs with Vagrant
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"
          vagrant up

      - name: Wait for all nodes SSH to become reachable
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"
          NODES="192.168.58.11 192.168.58.12 192.168.58.13"
          KEY=~/.vagrant.d/insecure_private_keys/vagrant.key.rsa

          # Chờ từng node SSH ready riêng lẻ
          for NODE in $NODES; do
            echo "Waiting for $NODE..."
            for i in {1..40}; do
              if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5                    -i "$KEY" vagrant@$NODE "echo ok" >/dev/null 2>&1; then
                echo "$NODE is reachable"
                break
              fi
              if [ $i -eq 40 ]; then
                echo "ERROR: $NODE not reachable after 40 attempts"
                exit 1
              fi
              echo "  attempt $i/40..."
              sleep 15
            done
          done
          echo "All nodes are reachable" 

      - name: Run Ansible playbook with retry
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"
          ansible-playbook -i inventory/hosts.yaml playbook.yml || {
            echo "First attempt failed, waiting 20s and retrying..."
            sleep 20
            ansible-playbook -i inventory/hosts.yaml playbook.yml
          }

      - name: Verify cluster after provisioning
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          kubectl get nodes -o wide
          kubectl get pods -A

      - name: Resolve variables
        id: vars
        shell: bash
        run: |
          echo "owner=${{ inputs.image_owner }}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.image_tag }}" = "latest" ]; then
            echo "tag=manual-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build context
        shell: bash
        run: |
          set -e
          cd "$DOCKER_DIR"
          chmod +x copybuild.sh
          ./copybuild.sh

      - name: Build and push base
        shell: bash
        run: |
          set -e
          cd "$DOCKER_DIR"
          IMAGE="ghcr.io/${{ steps.vars.outputs.owner }}/b5gc-base"
          TAG="${{ steps.vars.outputs.tag }}"
          docker build --target b5gc-base -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" -f nf.Dockerfile .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

      - name: Build and push controller
        shell: bash
        run: |
          set -e
          cd "$DOCKER_DIR"
          IMAGE="ghcr.io/${{ steps.vars.outputs.owner }}/b5gc-controller"
          TAG="${{ steps.vars.outputs.tag }}"
          docker build --build-arg B5GC_MODULE=controller -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" -f nf.Dockerfile .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

      - name: Build and push gateway
        shell: bash
        run: |
          set -e
          cd "$DOCKER_DIR"
          IMAGE="ghcr.io/${{ steps.vars.outputs.owner }}/b5gc-gateway"
          TAG="${{ steps.vars.outputs.tag }}"
          docker build --build-arg B5GC_MODULE=gateway -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" -f nf.Dockerfile .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

      - name: Build and push nsm
        shell: bash
        run: |
          set -e
          cd "$DOCKER_DIR"
          IMAGE="ghcr.io/${{ steps.vars.outputs.owner }}/b5gc-nsm"
          TAG="${{ steps.vars.outputs.tag }}"
          docker build --build-arg B5GC_MODULE=nsm -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" -f nf.Dockerfile .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

      - name: Build and push others
        shell: bash
        run: |
          set -e
          cd "$DOCKER_DIR"
          TAG="${{ steps.vars.outputs.tag }}"
          OWNER="${{ steps.vars.outputs.owner }}"
          for nf in ausf udm pcf damf amf smf pran; do
            IMAGE="ghcr.io/${OWNER}/b5gc-${nf}"
            docker build --build-arg B5GC_MODULE=${nf} -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" -f nf.Dockerfile .
            docker push "${IMAGE}:${TAG}"
            docker push "${IMAGE}:latest"
          done

      - name: Ensure namespace
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          kubectl create namespace etri6g --dry-run=client -o yaml | kubectl apply -f -

      - name: Render manifests
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"
          ./scripts/render-ghcr-images.sh "${{ steps.vars.outputs.owner }}" "${{ steps.vars.outputs.tag }}" rendered

      - name: Deploy manifests
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          kubectl apply -f rendered/ctrl.yaml
          kubectl apply -f rendered/gw.yaml
          kubectl apply -f rendered/nsm.yaml
          kubectl apply -f rendered/mongo.yaml
          kubectl apply -f rendered/deploy-other.yaml
          kubectl apply -f rendered/pran.yaml

          # Chờ tất cả pod Running trước khi tiếp tục
          kubectl rollout status deployment/ctrl-dep        -n etri6g --timeout=120s
          kubectl rollout status deployment/gateway-dep     -n etri6g --timeout=120s
          kubectl rollout status deployment/nsm-dep         -n etri6g --timeout=120s
          kubectl rollout status deployment/damf-dep        -n etri6g --timeout=120s
          kubectl rollout status deployment/amf-10-100-agent1-dep -n etri6g --timeout=120s
          kubectl rollout status deployment/amf-10-100-agent2-dep -n etri6g --timeout=120s
          kubectl rollout status deployment/pran-dep        -n etri6g --timeout=120s
          kubectl rollout status deployment/smf-slice1-dep   -n etri6g --timeout=120s
          kubectl rollout status deployment/smf-slice2-dep   -n etri6g --timeout=120s

      - name: Verify pods
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          kubectl get pods -n etri6g -o wide

      - name: Verify services
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          kubectl get svc -n etri6g
      - name: Deploy monitoring stack
        shell: bash
        run: |
          set -e
          export KUBECONFIG="$INFRA_DIR/kubeconfig"

          # Tạo namespace observability nếu chưa có
          kubectl create namespace observability --dry-run=client -o yaml | kubectl apply -f -

          # Thêm helm repo grafana
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

          # upgrade --install: cài mới nếu chưa có, update nếu đã có — idempotent
          helm upgrade --install loki    grafana/loki    -n observability -f "$INFRA_DIR/observability/loki-values.yaml"    --wait --timeout 3m
          helm upgrade --install alloy   grafana/alloy   -n observability -f "$INFRA_DIR/observability/alloy-values.yaml"   --wait --timeout 2m
          helm upgrade --install grafana grafana/grafana -n observability -f "$INFRA_DIR/observability/grafana-values.yaml" --wait --timeout 2m

          echo "Monitoring stack deployed"
          kubectl get pods -n observability

      - name: Restart WebUI backend
        shell: bash
        run: |
          WEBUI_DIR="${WEBUI_DIR}"

          # Kill process cũ nếu đang chạy
          pkill -f "uvicorn server:app" || true
          sleep 2

          # Start lại backend
          cd "$WEBUI_DIR/backend"
          export PATH="$PATH:$HOME/.local/bin"
          export PROJECT_DIR="$INFRA_DIR"
          export K8S_NAMESPACE=etri6g
          nohup uvicorn server:app --host 0.0.0.0 --port 8000 > /tmp/webui-backend.log 2>&1 &
          echo "WebUI backend started (PID $!)"

          # Chờ backend sẵn sàng
          for i in {1..10}; do
            if curl -sf http://localhost:8000/api/status >/dev/null 2>&1; then
              echo "Backend is up"
              break
            fi
            echo "Waiting for backend... attempt $i/10"
            sleep 2
          done

      - name: Restart WebUI frontend
        shell: bash
        run: |
          WEBUI_DIR="${WEBUI_DIR}"

          # Kill process cũ nếu đang chạy
          pkill -f "vite" || true
          sleep 2

          # Start lại frontend
          cd "$WEBUI_DIR/frontend"
          nohup npm run dev > /tmp/webui-frontend.log 2>&1 &
          echo "WebUI frontend started (PID $!)"
          echo "WebUI available at: http://localhost:3001"


      - name: Ensure UPF ready
        shell: bash
        run: |
          # Kiểm tra gtp5g kernel module
          KERNEL_VER=$(uname -r)
          if ! lsmod | grep -q gtp5g; then
            echo "Loading gtp5g for kernel $KERNEL_VER..."
            if ! sudo modprobe gtp5g 2>/dev/null; then
              echo "Build gtp5g from source..."
              cd "$GTP5G_DIR"
              make clean && make
              sudo insmod gtp5g.ko
            fi
          fi

          if ! lsmod | grep -q gtp5g; then
            echo "ERROR: gtp5g failed to load"
            exit 1
          fi
          echo "✓ gtp5g loaded"

          # Kiểm tra UPF process
          if ! pgrep -x "upf" > /dev/null; then
            echo "Starting UPF..."
            cd "$UPF_DIR"
            sudo nohup bin/upf -c config/upf.json > /tmp/upf.log 2>&1 &
            sleep 30
            if ! pgrep -x "upf" > /dev/null; then
              echo "ERROR: UPF failed to start"
              tail -10 /tmp/upf.log
              exit 1
            fi
          fi
          echo "✓ UPF running (PID: $(pgrep -x upf))"

      - name: Run 5G Core test
        shell: bash
        run: |
          set -e
          chmod +x "$INFRA_DIR/run-test.sh"
          "$INFRA_DIR/run-test.sh"
          