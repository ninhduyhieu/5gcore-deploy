name: Production-Style Infrastructure and Application CI/CD

on:
  workflow_dispatch:
    inputs:
      image_owner:
        description: "GHCR owner"
        required: true
        default: "ninhduyhieu"
      image_tag:
        description: "Image tag (Để 'latest' sẽ tự sinh chuỗi thời gian)"
        required: true
        default: "latest"

  push:
    branches: [main, develop]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "CI · Validate Syntax"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: pip install yamllint ansible

      - name: Lint YAML files
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 220}}}" \
            .github/workflows/build-and-deploy-local-source.yml \
            k8s/ observability/ roles/ playbook.yml

      - name: Check Ansible playbook syntax
        run: ansible-playbook --syntax-check -i inventory/hosts.yaml playbook.yml

  detect-changes:
    name: "CI · Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      need_infra: ${{ steps.detect.outputs.need_infra }}
      need_build: ${{ steps.detect.outputs.need_build }}
      need_deploy: ${{ steps.detect.outputs.need_deploy }}
      need_monitoring: ${{ steps.detect.outputs.need_monitoring }}
      need_webui: ${{ steps.detect.outputs.need_webui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed areas
        id: detect
        shell: bash
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "need_infra=true" >> "$GITHUB_OUTPUT"
            echo "need_build=true" >> "$GITHUB_OUTPUT"
            echo "need_deploy=true" >> "$GITHUB_OUTPUT"
            echo "need_monitoring=true" >> "$GITHUB_OUTPUT"
            echo "need_webui=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          echo "Changed files:"
          echo "$CHANGED"

          has_change() { echo "$CHANGED" | grep -qE "$1"; }

          NEED_INFRA=false
          NEED_BUILD=false
          NEED_DEPLOY=false
          NEED_MONITORING=false
          NEED_WEBUI=false

          if [ -z "$CHANGED" ]; then
            NEED_INFRA=true
            NEED_BUILD=true
            NEED_DEPLOY=true
            NEED_MONITORING=true
            NEED_WEBUI=true
          else
            has_change '(^Vagrantfile$|^inventory/|^roles/|^playbook\.yml$)' && NEED_INFRA=true
            has_change '(^docker/|nf\.Dockerfile$)' && NEED_BUILD=true
            has_change '(^k8s/|^scripts/render-ghcr-images\.sh$)' && NEED_DEPLOY=true
            has_change '^observability/' && NEED_MONITORING=true
            has_change '^webui/' && NEED_WEBUI=true
          fi

          if [ "$NEED_BUILD" = "true" ]; then
            NEED_DEPLOY=true
          fi

          echo "need_infra=$NEED_INFRA" >> "$GITHUB_OUTPUT"
          echo "need_build=$NEED_BUILD" >> "$GITHUB_OUTPUT"
          echo "need_deploy=$NEED_DEPLOY" >> "$GITHUB_OUTPUT"
          echo "need_monitoring=$NEED_MONITORING" >> "$GITHUB_OUTPUT"
          echo "need_webui=$NEED_WEBUI" >> "$GITHUB_OUTPUT"

  infra-ensure:
    name: "CD · Ensure Infra Healthy"
    runs-on: [self-hosted, linux, x64]
    needs: [validate, detect-changes]
    env:
      INFRA_DIR: ${{ vars.INFRA_DIR || '' }}
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
      image_owner: ${{ steps.vars.outputs.owner }}
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Resolve paths
        shell: bash
        run: |
          echo "INFRA_DIR=${INFRA_DIR:-$HOME/5gcore-deploy}" >> "$GITHUB_ENV"

      - name: Sync latest infra code into working directory
        shell: bash
        run: |
          set -e
          mkdir -p "$INFRA_DIR"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.vagrant/' \
            --exclude '.venv/' \
            --exclude 'kubeconfig' \
            "$GITHUB_WORKSPACE"/ "$INFRA_DIR"/

      - name: Generate/Resolve image tag
        id: vars
        shell: bash
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            OWNER="${{ inputs.image_owner }}"
            if [ "${{ inputs.image_tag }}" = "latest" ]; then
              TAG="manual-$(date +%Y%m%d-%H%M%S)"
            else
              TAG="${{ inputs.image_tag }}"
            fi
          else
            OWNER="ninhduyhieu"
            TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Ensure Vagrant VMs are running
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"
          for vm in k3s-server-1 k3s-agent-1 k3s-agent-2; do
            state=$(vagrant status "$vm" --machine-readable | awk -F, '/,state,/{print $4}' | tail -1)
            echo "$vm state: ${state:-unknown}"
            if [ "$state" = "aborted" ] || [ "$state" = "saved" ]; then
              vagrant halt -f "$vm" || true
            fi
          done
          timeout 20m vagrant up --no-parallel
          for vm in k3s-server-1 k3s-agent-1 k3s-agent-2; do
            vagrant ssh "$vm" -c "echo SSH_OK_$vm"
          done

      - name: Generate Ansible inventory from Vagrant SSH config
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"
          get_cfg() {
            local vm="$1"
            local key="$2"
            vagrant ssh-config "$vm" | awk -v k="$key" '$1 == k {print $2; exit}'
          }
          write_host() {
            local vm="$1"
            local node_ip="$2"
            local host port user key
            host=$(get_cfg "$vm" HostName)
            port=$(get_cfg "$vm" Port)
            user=$(get_cfg "$vm" User)
            key=$(get_cfg "$vm" IdentityFile | sed 's/^"//;s/"$//')
            {
              echo "    $vm:"
              echo "      ansible_host: $host"
              echo "      ansible_port: $port"
              echo "      ansible_user: $user"
              echo "      ansible_ssh_private_key_file: $key"
              echo "      ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'"
              echo "      ansible_python_interpreter: /usr/bin/python3"
              echo "      node_ip: $node_ip"
            } >> .ansible-vagrant-inventory.yaml
          }
          rm -f .ansible-vagrant-inventory.yaml
          echo "all:" >> .ansible-vagrant-inventory.yaml
          echo "  hosts:" >> .ansible-vagrant-inventory.yaml
          write_host k3s-server-1 192.168.58.11
          write_host k3s-agent-1 192.168.58.12
          write_host k3s-agent-2 192.168.58.13
          echo "  children:" >> .ansible-vagrant-inventory.yaml
          echo "    masters:" >> .ansible-vagrant-inventory.yaml
          echo "      hosts:" >> .ansible-vagrant-inventory.yaml
          echo "        k3s-server-1:" >> .ansible-vagrant-inventory.yaml
          echo "    workers:" >> .ansible-vagrant-inventory.yaml
          echo "      hosts:" >> .ansible-vagrant-inventory.yaml
          echo "        k3s-agent-1:" >> .ansible-vagrant-inventory.yaml
          echo "        k3s-agent-2:" >> .ansible-vagrant-inventory.yaml
          cat .ansible-vagrant-inventory.yaml

      - name: Release APT locks on VMs
        if: needs.detect-changes.outputs.need_infra == 'true'
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"
          for vm in k3s-server-1 k3s-agent-1 k3s-agent-2; do
            vagrant ssh "$vm" -c \
              "sudo killall -9 apt-get apt dpkg 2>/dev/null || true; \
               sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/lib/dpkg/lock; \
               sudo dpkg --configure -a || true" || true
          done

      - name: Apply Ansible configuration
        if: needs.detect-changes.outputs.need_infra == 'true'
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"
          ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook -i .ansible-vagrant-inventory.yaml playbook.yml

      - name: Cluster Health Check
        shell: bash
        run: |
          set -e
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          curl -k --fail https://192.168.58.11:6443/cacerts >/dev/null
          kubectl get nodes -o wide
          kubectl wait --for=condition=Ready node/k3s-server-1 --timeout=600s
          kubectl wait --for=condition=Ready node/k3s-agent-1 --timeout=900s
          kubectl wait --for=condition=Ready node/k3s-agent-2 --timeout=900s
          kubectl wait --for=condition=Ready pod -n kube-system -l k8s-app=calico-node --timeout=900s
          kubectl get nodes -o wide
          kubectl get pods -A -o wide

  app-delivery:
    name: "CD · Build & Deploy Application"
    runs-on: [self-hosted, linux, x64]
    needs: [infra-ensure, detect-changes]
    env:
      INFRA_DIR: ${{ vars.INFRA_DIR || '' }}
      DOCKER_DIR: ${{ vars.DOCKER_DIR || '' }}
      WEBUI_DIR: ${{ vars.WEBUI_DIR || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve paths
        shell: bash
        run: |
          echo "INFRA_DIR=${INFRA_DIR:-$HOME/5gcore-deploy}" >> "$GITHUB_ENV"
          echo "DOCKER_DIR=${DOCKER_DIR:-$HOME/Downloads/etrib5gc/docker}" >> "$GITHUB_ENV"
          echo "WEBUI_DIR=${WEBUI_DIR:-$HOME/Downloads/5gc-webui}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        if: needs.detect-changes.outputs.need_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push 5G Core Images
        if: needs.detect-changes.outputs.need_build == 'true'
        shell: bash
        run: |
          set -e
          cd "$DOCKER_DIR"
          chmod +x copybuild.sh
          ./copybuild.sh
          OWNER="${{ needs.infra-ensure.outputs.image_owner }}"
          TAG="${{ needs.infra-ensure.outputs.image_tag }}"
          BUILD_OPTS="--memory=2g --cpu-shares=512"
          for nf in b5gc-base controller gateway nsm ausf udm pcf damf amf smf pran; do
            docker build $BUILD_OPTS --build-arg B5GC_MODULE="$nf" -t "ghcr.io/${OWNER}/b5gc-${nf}:${TAG}" -t "ghcr.io/${OWNER}/b5gc-${nf}:latest" -f nf.Dockerfile .
            docker push "ghcr.io/${OWNER}/b5gc-${nf}:${TAG}"
            docker push "ghcr.io/${OWNER}/b5gc-${nf}:latest"
          done

      - name: Apply Kubernetes Manifests
        if: needs.detect-changes.outputs.need_deploy == 'true'
        shell: bash
        run: |
          set -e
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          cd "$INFRA_DIR"
          kubectl create namespace etri6g --dry-run=client -o yaml | kubectl apply -f -
          ./scripts/render-ghcr-images.sh "${{ needs.infra-ensure.outputs.image_owner }}" "${{ needs.infra-ensure.outputs.image_tag }}" rendered
          for f in ctrl gw nsm mongo deploy-other pran; do
            kubectl apply -f "rendered/${f}.yaml"
          done

      - name: Wait for Deployments
        if: needs.detect-changes.outputs.need_deploy == 'true'
        shell: bash
        run: |
          set -e
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          for dep in ctrl-dep gateway-dep nsm-dep udr-mongo ausf-dep udm-dep pcf-dep damf-dep amf-10-100-agent1-dep amf-10-100-agent2-dep smf-slice1-dep smf-slice2-dep pran-dep; do
            kubectl rollout status "deployment/${dep}" -n etri6g --timeout=300s
          done

      - name: Deploy Monitoring Stack
        if: needs.detect-changes.outputs.need_monitoring == 'true'
        shell: bash
        run: |
          set -e
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          cd "$INFRA_DIR"
          kubectl create namespace observability --dry-run=client -o yaml | kubectl apply -f -
          helm repo add grafana https://grafana.github.io/helm-charts || true
          helm repo update
          helm upgrade --install loki grafana/loki -n observability -f "$INFRA_DIR/observability/loki-values.yaml" --wait --timeout 10m
          helm upgrade --install alloy grafana/alloy -n observability -f "$INFRA_DIR/observability/alloy-values.yaml" --wait --timeout 10m
          helm upgrade --install grafana grafana/grafana -n observability -f "$INFRA_DIR/observability/grafana-values.yaml" --wait --timeout 10m
          kubectl get pods -n observability -o wide

      - name: Restart WebUI
        if: needs.detect-changes.outputs.need_webui == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -e
          pkill -f "uvicorn server:app" || true
          pkill -f "vite" || true
          sleep 2
          cd "$WEBUI_DIR/backend"
          export PROJECT_DIR="$INFRA_DIR"
          export K8S_NAMESPACE=etri6g
          nohup uvicorn server:app --host 0.0.0.0 --port 8000 > /tmp/webui-backend.log 2>&1 &
          cd "$WEBUI_DIR/frontend"
          nohup npm run dev > /tmp/webui-frontend.log 2>&1 &

      - name: Verify Current State
        shell: bash
        run: |
          set -e
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          echo "=== Nodes ==="
          kubectl get nodes -o wide
          echo "=== 5G Pods ==="
          kubectl get pods -n etri6g -o wide || true
          echo "=== Observability Pods ==="
          kubectl get pods -n observability -o wide || true
          echo "=== WebUI Process ==="
          pgrep -af "uvicorn server:app|vite" || true
