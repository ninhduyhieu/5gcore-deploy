name: Production-Style Infrastructure and Application CI/CD

on:
  workflow_dispatch:
    inputs:
      image_owner:
        description: "GHCR owner"
        required: true
        default: "ninhduyhieu"
      image_tag:
        description: "Image tag"
        required: true
        default: "latest"

  push:
    branches: [main, develop]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "CI · Validate Syntax"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: pip3 install --break-system-packages yamllint ansible

      - name: Lint YAML files
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 220}}}" \
            .github/workflows/build-and-deploy-local-source.yml \
            k8s/ observability/ roles/ playbook.yml

      - name: Check Ansible playbook syntax
        run: ansible-playbook --syntax-check -i inventory/hosts.yaml playbook.yml

  detect-changes:
    name: "CI · Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      need_infra:      ${{ steps.detect.outputs.need_infra }}
      need_build:      ${{ steps.detect.outputs.need_build }}
      need_deploy:     ${{ steps.detect.outputs.need_deploy }}
      need_monitoring: ${{ steps.detect.outputs.need_monitoring }}
      need_webui:      ${{ steps.detect.outputs.need_webui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed areas
        id: detect
        shell: bash
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "need_infra=true"      >> "$GITHUB_OUTPUT"
            echo "need_build=true"      >> "$GITHUB_OUTPUT"
            echo "need_deploy=true"     >> "$GITHUB_OUTPUT"
            echo "need_monitoring=true" >> "$GITHUB_OUTPUT"
            echo "need_webui=true"      >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          echo "Changed files:"
          echo "$CHANGED"

          NEED_INFRA=false
          NEED_BUILD=false
          NEED_DEPLOY=false
          NEED_MONITORING=false
          NEED_WEBUI=false

          echo "$CHANGED" | grep -qE '(^Vagrantfile$|^inventory/|^roles/|^playbook\.yml$)' && NEED_INFRA=true      || true
          echo "$CHANGED" | grep -qE '(^docker/|nf\.Dockerfile$)'                          && NEED_BUILD=true      || true
          echo "$CHANGED" | grep -qE '(^k8s/|^scripts/render-ghcr-images\.sh$)'            && NEED_DEPLOY=true     || true
          echo "$CHANGED" | grep -qE '^observability/'                                      && NEED_MONITORING=true || true
          echo "$CHANGED" | grep -qE '^webui/'                                              && NEED_WEBUI=true      || true

          if [ "$NEED_BUILD" = "true" ]; then
            NEED_DEPLOY=true
          fi

          echo "need_infra=$NEED_INFRA"           >> "$GITHUB_OUTPUT"
          echo "need_build=$NEED_BUILD"           >> "$GITHUB_OUTPUT"
          echo "need_deploy=$NEED_DEPLOY"         >> "$GITHUB_OUTPUT"
          echo "need_monitoring=$NEED_MONITORING" >> "$GITHUB_OUTPUT"
          echo "need_webui=$NEED_WEBUI"           >> "$GITHUB_OUTPUT"

  infra-ensure:
    name: "CD · Ensure Infra Healthy"
    runs-on: [self-hosted, linux, x64]
    needs: [validate, detect-changes]
    env:
      INFRA_DIR: ${{ vars.INFRA_DIR || '' }}
    outputs:
      image_owner: ${{ steps.vars.outputs.owner }}
      image_tag:   ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve paths
        shell: bash
        run: |
          echo "INFRA_DIR=${INFRA_DIR:-$HOME/5gcore-deploy}" >> "$GITHUB_ENV"

      # FIX: thêm --exclude cho .vagrant-ssh-config, .ansible-vagrant-inventory.yaml,
      # rendered/ và rendered-test/ — thiếu những exclude này khiến --delete xóa
      # các file runtime mỗi lần rsync, gây lỗi SSH ở lần commit thứ 2 trở đi.
      - name: Sync latest infra code
        shell: bash
        run: |
          set -e
          mkdir -p "$INFRA_DIR"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.vagrant/' \
            --exclude '.venv/' \
            --exclude 'kubeconfig' \
            --exclude '.vagrant-ssh-config' \
            --exclude '.ansible-vagrant-inventory.yaml' \
            --exclude 'rendered/' \
            --exclude 'rendered-test/' \
            "$GITHUB_WORKSPACE"/ "$INFRA_DIR"/

      - name: Generate image tag
        id: vars
        shell: bash
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            OWNER="${{ inputs.image_owner }}"
            if [ "${{ inputs.image_tag }}" = "latest" ]; then
              TAG="manual-$(date +%Y%m%d-%H%M%S)"
            else
              TAG="${{ inputs.image_tag }}"
            fi
          else
            OWNER="ninhduyhieu"
            TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          fi

          [ -z "$OWNER" ] && OWNER="ninhduyhieu"
          [ -z "$TAG"   ] && TAG="latest"

          echo "OWNER=$OWNER  TAG=$TAG"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"

      - name: Ensure Vagrant VMs are running with stable ports
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"

          echo "=== Vagrant status before boot ==="
          vagrant status || true

          for vm in k3s-server-1 k3s-agent-1 k3s-agent-2; do
            state=$(vagrant status "$vm" --machine-readable | awk -F, '/,state,/{print $4}' | tail -1)
            echo "$vm state: ${state:-unknown}"

            if [ "$state" = "aborted" ] || [ "$state" = "saved" ]; then
              vagrant halt -f "$vm" || true
            fi
          done

          # Không destroy VM — reuse để SSH port giữ nguyên 2200/2201/2202.
          timeout 20m vagrant up --no-parallel

      # FIX: Dùng printf thay vì heredoc (heredoc bị indent theo YAML → SSH config
      # parser đọc sai). HostName dùng 127.0.0.1 thay alias VM. IdentityFile chỉ
      # lấy dòng đầu tiên (Vagrant 2.3+ liệt kê 2 key — ed25519 + rsa — gây lỗi
      # "Invalid format" khi ghi vào $GITHUB_ENV).
      - name: Generate SSH config
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"

          get_port() { vagrant ssh-config "$1" 2>/dev/null | awk '/^\s*Port /{print $2; exit}'; }
          get_key()  { vagrant ssh-config "$1" 2>/dev/null | awk '/^\s*IdentityFile /{print $2; exit}'; }
          get_keys() { vagrant ssh-config "$1" 2>/dev/null | awk '/^\s*IdentityFile /{print $2}'; }

          PORT_SERVER1=$(get_port k3s-server-1)
          PORT_AGENT1=$(get_port  k3s-agent-1)
          PORT_AGENT2=$(get_port  k3s-agent-2)
          KEY_SERVER1=$(get_key   k3s-server-1)
          KEY_AGENT1=$(get_key    k3s-agent-1)
          KEY_AGENT2=$(get_key    k3s-agent-2)

          for var in PORT_SERVER1 PORT_AGENT1 PORT_AGENT2 KEY_SERVER1 KEY_AGENT1 KEY_AGENT2; do
            val=$(eval echo "\$$var")
            if [ -z "$val" ]; then
              echo "ERROR: failed to parse $var from vagrant ssh-config"
              exit 1
            fi
          done
          echo "Ports: server=$PORT_SERVER1  agent1=$PORT_AGENT1  agent2=$PORT_AGENT2"

          write_ssh_block() {
            local vm=$1 port=$2
            printf 'Host %s\n' "$vm"
            printf '  HostName 127.0.0.1\n'
            printf '  User vagrant\n'
            printf '  Port %s\n' "$port"
            get_keys "$vm" | while IFS= read -r keyfile; do
              printf '  IdentityFile %s\n' "$keyfile"
            done
            printf '  StrictHostKeyChecking no\n'
            printf '  UserKnownHostsFile /dev/null\n'
            printf '  PasswordAuthentication no\n'
            printf '  LogLevel FATAL\n'
            printf '\n'
          }

          {
            write_ssh_block "k3s-server-1" "$PORT_SERVER1"
            write_ssh_block "k3s-agent-1"  "$PORT_AGENT1"
            write_ssh_block "k3s-agent-2"  "$PORT_AGENT2"
          } > "$INFRA_DIR/.vagrant-ssh-config"

          chmod 600 "$INFRA_DIR/.vagrant-ssh-config"
          echo "=== Generated SSH config ==="
          cat "$INFRA_DIR/.vagrant-ssh-config"

          echo "PORT_SERVER1=$PORT_SERVER1" >> "$GITHUB_ENV"
          echo "PORT_AGENT1=$PORT_AGENT1"   >> "$GITHUB_ENV"
          echo "PORT_AGENT2=$PORT_AGENT2"   >> "$GITHUB_ENV"
          echo "KEY_SERVER1=$KEY_SERVER1"   >> "$GITHUB_ENV"
          echo "KEY_AGENT1=$KEY_AGENT1"     >> "$GITHUB_ENV"
          echo "KEY_AGENT2=$KEY_AGENT2"     >> "$GITHUB_ENV"

      - name: Verify SSH connectivity with retry
        shell: bash
        run: |
          set -e

          for vm in k3s-server-1 k3s-agent-1 k3s-agent-2; do
            echo "--- Testing SSH to $vm ---"
            ok=false
            for attempt in $(seq 1 10); do
              if ssh \
                   -F "$INFRA_DIR/.vagrant-ssh-config" \
                   -o StrictHostKeyChecking=no \
                   -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=10 \
                   "$vm" "echo SSH_OK_$vm"; then
                ok=true
                break
              fi
              echo "  Attempt $attempt/10 failed — waiting 15s..."
              sleep 15
            done
            if [ "$ok" = "false" ]; then
              echo "ERROR: cannot SSH into $vm after 10 attempts."
              exit 1
            fi
          done

      # FIX: ansible_host dùng 127.0.0.1 + ansible_port tường minh thay vì alias VM.
      # ansible_ssh_common_args là chuỗi đơn, không dùng -F flag (không cần nữa vì
      # đã có ansible_port + ansible_ssh_private_key_file).
      - name: Generate Ansible inventory
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"

          printf '%s\n' \
            "all:" \
            "  hosts:" \
            "    k3s-server-1:" \
            "      ansible_host: 127.0.0.1" \
            "      ansible_port: ${PORT_SERVER1}" \
            "      ansible_user: vagrant" \
            "      ansible_ssh_private_key_file: ${KEY_SERVER1}" \
            "      ansible_python_interpreter: /usr/bin/python3" \
            "      ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'" \
            "      node_ip: 192.168.58.11" \
            "    k3s-agent-1:" \
            "      ansible_host: 127.0.0.1" \
            "      ansible_port: ${PORT_AGENT1}" \
            "      ansible_user: vagrant" \
            "      ansible_ssh_private_key_file: ${KEY_AGENT1}" \
            "      ansible_python_interpreter: /usr/bin/python3" \
            "      ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'" \
            "      node_ip: 192.168.58.12" \
            "    k3s-agent-2:" \
            "      ansible_host: 127.0.0.1" \
            "      ansible_port: ${PORT_AGENT2}" \
            "      ansible_user: vagrant" \
            "      ansible_ssh_private_key_file: ${KEY_AGENT2}" \
            "      ansible_python_interpreter: /usr/bin/python3" \
            "      ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'" \
            "      node_ip: 192.168.58.13" \
            "  children:" \
            "    masters:" \
            "      hosts:" \
            "        k3s-server-1:" \
            "    workers:" \
            "      hosts:" \
            "        k3s-agent-1:" \
            "        k3s-agent-2:" \
            > .ansible-vagrant-inventory.yaml

          echo "=== Generated Ansible inventory ==="
          cat .ansible-vagrant-inventory.yaml

      - name: Release APT locks on VMs
        if: needs.detect-changes.outputs.need_infra == 'true'
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"

          for vm in k3s-server-1 k3s-agent-1 k3s-agent-2; do
            vagrant ssh "$vm" -c \
              "sudo killall -9 apt-get apt dpkg 2>/dev/null || true; \
               sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/lib/dpkg/lock; \
               sudo dpkg --configure -a || true" || true
          done

      - name: Apply Ansible configuration
        if: needs.detect-changes.outputs.need_infra == 'true'
        shell: bash
        run: |
          set -e
          cd "$INFRA_DIR"

          ANSIBLE_HOST_KEY_CHECKING=False \
          ansible-playbook -i .ansible-vagrant-inventory.yaml playbook.yml -vv

      - name: Cluster Health Check with Auto-Heal
        shell: bash
        run: |
          set -e
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          cd "$INFRA_DIR"

          echo "Checking K3s API /cacerts..."
          curl -k --fail https://192.168.58.11:6443/cacerts >/dev/null

          echo "Initial node state..."
          kubectl get nodes -o wide || true

          echo "Auto-heal Vagrant workers if NotReady..."
          healed=false
          for vm in k3s-agent-1 k3s-agent-2; do
            if ! kubectl get node "$vm" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null | grep -q True; then
              echo "$vm is NotReady -> restart VM and k3s-agent"
              vagrant halt -f "$vm" || true
              timeout 10m vagrant up "$vm" --no-provision
              vagrant ssh "$vm" -c "sudo systemctl restart k3s-agent || sudo systemctl restart k3s || true"
              healed=true
            fi
          done

          # Chỉ sleep khi có VM vừa được restart
          if [ "$healed" = "true" ]; then
            echo "Waiting for kubelet/k3s-agent/Calico to settle..."
            sleep 120
          fi

          echo "Final node state before wait..."
          kubectl get nodes -o wide     || true
          kubectl get pods -n kube-system -o wide || true

          kubectl wait --for=condition=Ready node/k3s-server-1 --timeout=600s
          kubectl wait --for=condition=Ready node/k3s-agent-1  --timeout=900s
          kubectl wait --for=condition=Ready node/k3s-agent-2  --timeout=900s

          kubectl wait --for=condition=Ready pod \
            -n kube-system \
            -l k8s-app=calico-node \
            --timeout=900s

          kubectl get nodes -o wide
          kubectl get pods -A -o wide

  pre-deploy-test:
    name: "CI · Pre-Deploy Test"
    runs-on: [self-hosted, linux, x64]
    needs: [infra-ensure, detect-changes]
    env:
      INFRA_DIR: ${{ vars.INFRA_DIR || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve paths
        shell: bash
        run: |
          echo "INFRA_DIR=${INFRA_DIR:-$HOME/5gcore-deploy}" >> "$GITHUB_ENV"

      - name: Run simple smoke tests before deploy
        shell: bash
        run: |
          set -e
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          cd "$INFRA_DIR"

          echo "=== Cluster connectivity ==="
          kubectl get nodes -o wide
          kubectl get pods -n kube-system -o wide

          if [ "${{ needs.detect-changes.outputs.need_deploy }}" = "true" ]; then
            echo "=== Check manifests exist ==="
            test -f k8s/ctrl.yaml
            test -f k8s/gw.yaml
            test -f k8s/nsm.yaml
            test -f k8s/mongo.yaml
            test -f k8s/deploy-other.yaml
            test -f k8s/pran.yaml
            test -x scripts/render-ghcr-images.sh

            echo "=== Dry-run render/apply manifests ==="
            OWNER="${{ needs.infra-ensure.outputs.image_owner }}"
            TAG="${{ needs.infra-ensure.outputs.image_tag }}"
            [ -z "$OWNER" ] && OWNER="ninhduyhieu"
            [ -z "$TAG"   ] && TAG="latest"

            ./scripts/render-ghcr-images.sh "$OWNER" "$TAG" rendered-test

            kubectl create namespace etri6g \
              --dry-run=client -o yaml | kubectl apply -f -

            for f in ctrl gw nsm mongo deploy-other pran; do
              echo "Validating rendered-test/${f}.yaml"
              kubectl apply --dry-run=server -f "rendered-test/${f}.yaml"
            done
          fi

  app-delivery:
    name: "CD · Build & Deploy Application"
    runs-on: [self-hosted, linux, x64]
    needs: [infra-ensure, detect-changes, pre-deploy-test]
    env:
      INFRA_DIR:  ${{ vars.INFRA_DIR  || '' }}
      SOURCE_DIR: ${{ vars.SOURCE_DIR || '' }}
      DOCKER_DIR: ${{ vars.DOCKER_DIR || '' }}
      WEBUI_DIR:  ${{ vars.WEBUI_DIR  || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve paths
        shell: bash
        run: |
          echo "INFRA_DIR=${INFRA_DIR:-$HOME/5gcore-deploy}"               >> "$GITHUB_ENV"
          echo "SOURCE_DIR=${SOURCE_DIR:-$HOME/Downloads/etrib5gc}"        >> "$GITHUB_ENV"
          echo "DOCKER_DIR=${DOCKER_DIR:-$HOME/Downloads/etrib5gc/docker}" >> "$GITHUB_ENV"
          echo "WEBUI_DIR=${WEBUI_DIR:-$HOME/Downloads/5gc-webui}"         >> "$GITHUB_ENV"

      # FIX: exclude đầy đủ — rsync ở đây chạy sau khi infra-ensure đã tạo SSH config.
      - name: Sync manifest, scripts and observability configs
        shell: bash
        run: |
          set -e
          mkdir -p "$INFRA_DIR"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.vagrant/' \
            --exclude '.venv/' \
            --exclude 'kubeconfig' \
            --exclude '.vagrant-ssh-config' \
            --exclude '.ansible-vagrant-inventory.yaml' \
            --exclude 'rendered/' \
            --exclude 'rendered-test/' \
            "$GITHUB_WORKSPACE"/ "$INFRA_DIR"/

      - name: Login to GHCR
        if: needs.detect-changes.outputs.need_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push 5G Core Images
        if: needs.detect-changes.outputs.need_build == 'true'
        shell: bash
        run: |
          set -e

          if [ ! -d "$DOCKER_DIR" ]; then
            echo "ERROR: DOCKER_DIR=$DOCKER_DIR does not exist on this runner."
            exit 1
          fi

          cd "$DOCKER_DIR"

          OWNER="${{ needs.infra-ensure.outputs.image_owner }}"
          TAG="${{ needs.infra-ensure.outputs.image_tag }}"
          [ -z "$OWNER" ] && OWNER="ninhduyhieu"
          [ -z "$TAG"   ] && TAG="latest"

          echo "Building with OWNER=$OWNER TAG=$TAG"

          chmod +x copybuild.sh
          ./copybuild.sh

          BUILD_OPTS="--memory=2g --cpu-shares=512"

          docker build $BUILD_OPTS \
            --target b5gc-base \
            -t "ghcr.io/${OWNER}/b5gc-base:${TAG}" \
            -t "ghcr.io/${OWNER}/b5gc-base:latest" \
            -f nf.Dockerfile .

          docker push "ghcr.io/${OWNER}/b5gc-base:${TAG}"
          docker push "ghcr.io/${OWNER}/b5gc-base:latest"

          for module in controller gateway nsm; do
            docker build $BUILD_OPTS \
              --build-arg B5GC_MODULE="$module" \
              -t "ghcr.io/${OWNER}/b5gc-${module}:${TAG}" \
              -t "ghcr.io/${OWNER}/b5gc-${module}:latest" \
              -f nf.Dockerfile .
            docker push "ghcr.io/${OWNER}/b5gc-${module}:${TAG}"
            docker push "ghcr.io/${OWNER}/b5gc-${module}:latest"
          done

          for nf in ausf udm pcf damf amf smf pran; do
            docker build $BUILD_OPTS \
              --build-arg B5GC_MODULE="$nf" \
              -t "ghcr.io/${OWNER}/b5gc-${nf}:${TAG}" \
              -t "ghcr.io/${OWNER}/b5gc-${nf}:latest" \
              -f nf.Dockerfile .
            docker push "ghcr.io/${OWNER}/b5gc-${nf}:${TAG}"
            docker push "ghcr.io/${OWNER}/b5gc-${nf}:latest"
          done

      - name: Pre-deploy Cluster Gate with Auto-Heal
        if: >
          needs.detect-changes.outputs.need_deploy == 'true' ||
          needs.detect-changes.outputs.need_monitoring == 'true'
        shell: bash
        run: |
          set -e
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          cd "$INFRA_DIR"

          echo "Checking K3s API /cacerts..."
          curl -k --fail https://192.168.58.11:6443/cacerts >/dev/null

          kubectl get nodes -o wide || true

          healed=false
          for vm in k3s-agent-1 k3s-agent-2; do
            if ! kubectl get node "$vm" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null | grep -q True; then
              echo "$vm is NotReady -> restart"
              vagrant halt -f "$vm" || true
              timeout 10m vagrant up "$vm" --no-provision
              vagrant ssh "$vm" -c "sudo systemctl restart k3s-agent || sudo systemctl restart k3s || true"
              healed=true
            fi
          done

          if [ "$healed" = "true" ]; then
            sleep 120
          fi

          kubectl get nodes -o wide
          kubectl wait --for=condition=Ready node/k3s-server-1 --timeout=600s
          kubectl wait --for=condition=Ready node/k3s-agent-1  --timeout=900s
          kubectl wait --for=condition=Ready node/k3s-agent-2  --timeout=900s

      - name: Apply Kubernetes Manifests
        if: needs.detect-changes.outputs.need_deploy == 'true'
        shell: bash
        run: |
          set -e
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          cd "$INFRA_DIR"

          OWNER="${{ needs.infra-ensure.outputs.image_owner }}"
          TAG="${{ needs.infra-ensure.outputs.image_tag }}"
          [ -z "$OWNER" ] && OWNER="ninhduyhieu"
          [ -z "$TAG"   ] && TAG="latest"

          kubectl create namespace etri6g --dry-run=client -o yaml | kubectl apply -f -

          ./scripts/render-ghcr-images.sh "$OWNER" "$TAG" rendered

          kubectl apply -f rendered/ctrl.yaml
          kubectl apply -f rendered/gw.yaml
          kubectl apply -f rendered/nsm.yaml
          kubectl apply -f rendered/mongo.yaml
          kubectl apply -f rendered/deploy-other.yaml
          kubectl apply -f rendered/pran.yaml

      - name: Wait for 5GC Deployments with rollback
        if: needs.detect-changes.outputs.need_deploy == 'true'
        shell: bash
        run: |
          set -e
          export KUBECONFIG="$INFRA_DIR/kubeconfig"

          DEPLOYMENTS="ctrl-dep gateway-dep nsm-dep udr-mongo \
            ausf-dep udm-dep pcf-dep damf-dep \
            amf-10-100-agent1-dep amf-10-100-agent2-dep \
            smf-slice1-dep smf-slice2-dep pran-dep"

          failed=""
          for dep in $DEPLOYMENTS; do
            echo "Checking rollout: $dep"
            if ! kubectl rollout status "deployment/${dep}" -n etri6g --timeout=300s; then
              echo "Rollout failed: $dep"
              failed="$failed $dep"
            fi
          done

          if [ -n "$failed" ]; then
            echo "Rollback deployments:$failed"
            for dep in $failed; do
              kubectl rollout undo "deployment/${dep}" -n etri6g || true
            done
            kubectl get pods -n etri6g -o wide || true
            exit 1
          fi

      - name: Deploy Monitoring Stack Loki Alloy Grafana
        if: needs.detect-changes.outputs.need_monitoring == 'true'
        shell: bash
        run: |
          set -e
          export KUBECONFIG="$INFRA_DIR/kubeconfig"
          cd "$INFRA_DIR"

          kubectl create namespace observability --dry-run=client -o yaml | kubectl apply -f -

          helm repo add grafana https://grafana.github.io/helm-charts || true
          helm repo update

          helm upgrade --install loki grafana/loki \
            -n observability \
            -f "$INFRA_DIR/observability/loki-values.yaml" \
            --wait --timeout 10m

          helm upgrade --install alloy grafana/alloy \
            -n observability \
            -f "$INFRA_DIR/observability/alloy-values.yaml" \
            --wait --timeout 10m

          helm upgrade --install grafana grafana/grafana \
            -n observability \
            -f "$INFRA_DIR/observability/grafana-values.yaml" \
            --wait --timeout 10m

          kubectl get pods -n observability -o wide

      - name: Restart Dashboard Application WebUI
        if: >
          needs.detect-changes.outputs.need_webui == 'true' ||
          github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -e

          pkill -f "uvicorn server:app" || true
          pkill -f "vite"               || true
          sleep 2

          cd "$WEBUI_DIR/backend"
          export PROJECT_DIR="$INFRA_DIR"
          export K8S_NAMESPACE=etri6g
          nohup uvicorn server:app --host 0.0.0.0 --port 8000 > /tmp/webui-backend.log 2>&1 &

          cd "$WEBUI_DIR/frontend"
          nohup npm run dev -- --host 0.0.0.0 > /tmp/webui-frontend.log 2>&1 &

      - name: Verify Current State
        shell: bash
        run: |
          export KUBECONFIG="$INFRA_DIR/kubeconfig"

          echo "=== Nodes ==="
          kubectl get nodes -o wide || true

          echo "=== 5G Pods ==="
          kubectl get pods -n etri6g -o wide || true

          echo "=== Observability Pods ==="
          kubectl get pods -n observability -o wide || true

          echo "=== WebUI Process ==="
          pgrep -af "uvicorn server:app|vite" || true
