{{- $root := . }}
{{- $nfs := dict "controller" .Values.controller "gateway" .Values.gateway "nsm" .Values.nsm "udm" .Values.udm "ausf" .Values.ausf "pcf" .Values.pcf "damf" .Values.damf "smf" .Values.smf "pran" .Values.pran "sepp" .Values.sepp -}}
{{- range $nfName := list "controller" "gateway" "nsm" "udm" "ausf" "pcf" "damf" "smf" "pran" "sepp" }}
{{- $nfConf := index $nfs $nfName }}
{{- if and $nfConf $nfConf.enabled $nfConf.service }}
{{- $svc := $nfConf.service }}
{{- $syncWave := $root.Values.global.syncWave.core }}
{{- if eq $nfName "controller" }}{{ $syncWave = $root.Values.global.syncWave.mesh }}{{ end }}
{{- if eq $nfName "gateway" }}{{ $syncWave = $root.Values.global.syncWave.mesh }}{{ end }}
{{- if eq $nfName "smf" }}{{ $syncWave = $root.Values.global.syncWave.smf }}{{ end }}
{{- if eq $nfName "pran" }}{{ $syncWave = $root.Values.global.syncWave.amfPran }}{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $nfName }}-svc
  namespace: {{ $root.Values.global.namespace }}
  labels:
    app: {{ $nfName }}
    plmnId: {{ $root.Values.global.plmnIdLabel }}
    {{- include "etrib5gc.labels" $root | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $syncWave | quote }}
spec:
  {{- if $svc.clusterIP }}
  clusterIP: {{ $svc.clusterIP }}
  {{- end }}
  {{- if $svc.type }}
  type: {{ $svc.type }}
  {{- end }}
  selector:
    app: {{ $nfName }}
    plmnId: {{ $root.Values.global.plmnIdLabel }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
      protocol: TCP
      {{- if and (eq $svc.type "NodePort") $svc.nodePort }}
      nodePort: {{ $svc.nodePort }}
      {{- end }}
{{- end }}
{{- end }}
