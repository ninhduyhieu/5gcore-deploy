{{- $root := . }}
{{- $files := .Files }}
{{- $nfs := dict "controller" .Values.controller "gateway" .Values.gateway "nsm" .Values.nsm "udm" .Values.udm "ausf" .Values.ausf "pcf" .Values.pcf "damf" .Values.damf "smf" .Values.smf "pran" .Values.pran "sepp" .Values.sepp -}}
{{- range $nfName := list "controller" "gateway" "nsm" "udm" "ausf" "pcf" "damf" "smf" "pran" "sepp" }}
{{- $nfConf := index $nfs $nfName }}
{{- if and $nfConf $nfConf.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $nfName }}-config
  namespace: {{ $root.Values.global.namespace }}
  labels:
    app: {{ $nfName }}
    {{- include "etrib5gc.labels" $root | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $root.Values.global.syncWave.core | quote }}
data:
  {{ $nfName }}.json: |
{{- $fileContent := $files.Get (printf "config/%s.json" $nfName) }}
{{- if $fileContent }}
    {{ $fileContent | nindent 4 }}
{{- else }}
    {}
{{- end }}
{{- end }}
{{- end }}

{{- range $amfSet := .Values.amfSets }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: amf-{{ $amfSet.setId }}-config
  namespace: {{ $root.Values.global.namespace }}
  labels:
    app: amf
    amfset: {{ $amfSet.setId }}
    {{- include "etrib5gc.labels" $root | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $root.Values.global.syncWave.amfPran | quote }}
data:
  amf.json: |
{{- $amfContent := $files.Get "config/amf.json" }}
{{- if $amfContent }}
    {{ $amfContent | nindent 4 }}
{{- else }}
    {}
{{- end }}
{{- end }}
