{{- $root := . }}
{{- $nfs := dict "controller" .Values.controller "gateway" .Values.gateway "nsm" .Values.nsm "udm" .Values.udm "ausf" .Values.ausf "pcf" .Values.pcf "damf" .Values.damf "smf" .Values.smf "pran" .Values.pran "sepp" .Values.sepp -}}
{{- range $nfName := list "controller" "gateway" "nsm" "udm" "ausf" "pcf" "damf" "smf" "pran" "sepp" }}
{{- $nfConf := index $nfs $nfName }}
{{- if and $nfConf $nfConf.enabled }}
{{- $syncWave := $root.Values.global.syncWave.core }}
{{- if eq $nfName "controller" }}{{ $syncWave = $root.Values.global.syncWave.mesh }}{{ end }}
{{- if eq $nfName "gateway" }}{{ $syncWave = $root.Values.global.syncWave.mesh }}{{ end }}
{{- if eq $nfName "smf" }}{{ $syncWave = $root.Values.global.syncWave.smf }}{{ end }}
{{- if eq $nfName "pran" }}{{ $syncWave = $root.Values.global.syncWave.amfPran }}{{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $nfName }}-dep
  namespace: {{ $root.Values.global.namespace }}
  labels:
    app: {{ $nfName }}
    plmnId: {{ $root.Values.global.plmnIdLabel }}
    {{- include "etrib5gc.labels" $root | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $syncWave | quote }}
spec:
  replicas: {{ $nfConf.replicas }}
  selector:
    matchLabels:
      app: {{ $nfName }}
      plmnId: {{ $root.Values.global.plmnIdLabel }}
  template:
    metadata:
      labels:
        app: {{ $nfName }}
        plmnId: {{ $root.Values.global.plmnIdLabel }}
    spec:
      {{- if $nfConf.nodeSelector }}
      nodeSelector:
        {{- toYaml $nfConf.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if and $nfConf.serviceAccount $nfConf.serviceAccount.create }}
      serviceAccountName: {{ $nfConf.serviceAccount.name }}
      {{- end }}
      containers:
        - name: {{ $nfName }}
          image: {{ $nfConf.image }}:latest
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          command: {{ toJson $nfConf.command }}
          args: {{ toJson $nfConf.args }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
      volumes:
        - name: config-volume
          configMap:
            name: {{ $nfName }}-config
{{- end }}
{{- end }}
