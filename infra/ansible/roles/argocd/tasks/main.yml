- name: Create argocd namespace
  shell: k3s kubectl apply -f /vagrant/argocd/namespace.yaml
  delegate_to: k3s-server
  changed_when: false

- name: Install Argo CD
  shell: |
    k3s kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
  delegate_to: k3s-server
  register: argocd_install
  changed_when: false

- name: Wait for Argo CD server to be ready
  shell: k3s kubectl rollout status deployment/argocd-server -n argocd --timeout=300s
  delegate_to: k3s-server
  changed_when: false

- name: Patch Argo CD server to NodePort
  shell: |
    k3s kubectl patch svc argocd-server -n argocd -p '{"spec":{"type":"NodePort","ports":[{"port":80,"targetPort":8080,"nodePort":{{ argocd_nodeport }}}]}}'
  delegate_to: k3s-server
  changed_when: false

- name: Apply root Application (app-of-apps)
  shell: k3s kubectl apply -f /vagrant/argocd/templates/root-app.yaml
  delegate_to: k3s-server
  changed_when: false

- name: Apply ETRI B5GC Application
  shell: k3s kubectl apply -f /vagrant/argocd/templates/etrib5gc-app.yaml
  delegate_to: k3s-server
  changed_when: false

- name: Wait for ETRI B5GC Application to sync
  shell: |
    k3s kubectl wait --for=condition=Synced application/etrib5gc -n argocd --timeout=300s || true
  delegate_to: k3s-server
  changed_when: false

- name: Get Argo CD admin password
  shell: k3s kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
  delegate_to: k3s-server
  register: argocd_password
  changed_when: false

- name: Show Argo CD access info
  debug:
    msg: "Argo CD UI: http://{{ master_ip }}:{{ argocd_nodeport }} | User: admin | Password: {{ argocd_password.stdout }}"
