- name: Install build dependencies
  apt:
    name:
      - build-essential
      - git
      - linux-headers-{{ ansible_kernel }}
    state: present
    update_cache: true

- name: Check if gtp5g module is already loaded
  shell: lsmod | grep -q gtp5g
  register: gtp5g_loaded
  failed_when: false
  changed_when: false

- name: Clone gtp5g repository
  git:
    repo: "https://github.com/free5gc/gtp5g.git"
    dest: /opt/gtp5g
    version: "{{ gtp5g_version }}"
  when: gtp5g_loaded.rc != 0

- name: Build gtp5g kernel module
  shell: make
  args:
    chdir: /opt/gtp5g
  when: gtp5g_loaded.rc != 0

- name: Install gtp5g kernel module
  shell: make install
  args:
    chdir: /opt/gtp5g
  when: gtp5g_loaded.rc != 0

- name: Load gtp5g module
  shell: modprobe gtp5g
  when: gtp5g_loaded.rc != 0

- name: Configure gtp5g to load on boot
  copy:
    dest: /etc/modules-load.d/gtp5g.conf
    content: "gtp5g\n"
