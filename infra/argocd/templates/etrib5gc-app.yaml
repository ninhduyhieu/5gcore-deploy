apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: etrib5gc
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: etrib5gc
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    path: helm/etrib5gc
    repoURL: file:///vagrant
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: etri6g
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
