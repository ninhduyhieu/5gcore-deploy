---
- name: Install required packages for K3s
  apt:
    name:
      - curl
    state: present
    update_cache: true

- name: Download K3s install script
  get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s_install.sh
    mode: '0755'
    validate_certs: false

- name: Remove stale/corrupted K3s server containerd state
  file:
    path: /var/lib/rancher/k3s/agent/containerd
    state: absent
  when: reset_k3s_state | default(false) | bool

- name: Remove corrupted kubelet actuated pods checkpoint
  file:
    path: /var/lib/kubelet/actuated_pods_state
    state: absent

- name: Execute K3s installation script (Server)
  shell: /tmp/k3s_install.sh
  environment:
    INSTALL_K3S_EXEC: >-
      server
      --disable traefik
      --flannel-backend=none
      --disable-network-policy
      --cluster-cidr=172.16.0.0/16
      --service-cidr=10.43.0.0/16
      --tls-san=192.168.58.11
      --node-ip=192.168.58.11
      --advertise-address=192.168.58.11
      --bind-address=192.168.58.11
  args:
    creates: /var/lib/rancher/k3s/server/node-token

- name: Enable k3s service
  systemd:
    name: k3s
    enabled: true
    state: started

- name: Wait for token to be available
  wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    state: present
    timeout: 300

- name: Read K3s node-token
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: token_raw

- name: Set K3s token as fact
  set_fact:
    k3s_token: "{{ token_raw['content'] | b64decode | trim }}"

- name: Wait for K3s /cacerts endpoint
  uri:
    url: https://127.0.0.1:6443/cacerts
    validate_certs: false
    status_code: 200
  register: k3s_cacerts
  retries: 60
  delay: 5
  until: k3s_cacerts.status == 200

- name: Allow vagrant user to read kubeconfig
  shell: |
    groupadd -f k3s-readers
    chgrp k3s-readers /etc/rancher/k3s/k3s.yaml
    chmod 640 /etc/rancher/k3s/k3s.yaml
    usermod -aG k3s-readers vagrant
  changed_when: true
