---
- name: Install required packages for K3s
  apt:
    name:
      - curl
    state: present
    update_cache: yes

- name: Download K3s install script
  get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s_install.sh
    mode: '0755'

- name: Read K3s token from fetched file
  set_fact:
    k3s_token: "{{ lookup('file', '/tmp/k3s-node-token') | trim }}"

- name: Ensure K3s config directory exists
  file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'

- name: Write K3s agent config
  copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: '0600'
    content: |
      server: https://{{ hostvars[groups['masters'][0]].ansible_host }}:6443
      token: {{ k3s_token }}
      node-ip: {{ ansible_host }}

- name: Install K3s agent and join cluster
  command: /tmp/k3s_install.sh
  environment:
    INSTALL_K3S_EXEC: agent
  args:
    creates: /usr/local/bin/k3s

- name: Enable k3s-agent service
  systemd:
    name: k3s-agent
    enabled: yes
    state: started
