---
- name: Install required packages for K3s
  apt:
    name:
      - curl
    state: present
    update_cache: yes

- name: Download K3s install script
  get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s_install.sh
    mode: '0755'

- name: Read K3s token from fetched file
  set_fact:
    k3s_token: "{{ lookup('file', '/tmp/k3s-node-token') | trim }}"

- name: Install K3s agent and join cluster
  shell: |
    INSTALL_K3S_EXEC="agent --node-ip={{ ansible_host }} --node-external-ip={{ ansible_host }} --flannel-iface=eth1" \
    K3S_URL="https://{{ hostvars[groups['masters'][0]].ansible_host }}:6443" \
    K3S_TOKEN="{{ k3s_token }}" \
    /tmp/k3s_install.sh
  # Bỏ thuộc tính 'creates' cũ để đảm bảo nếu cấu hình lỗi, Ansible vẫn có thể ghi đè/sửa lại cấu hình chuẩn.

- name: Enable k3s-agent service
  systemd:
    name: k3s-agent
    enabled: yes
    state: restarted # Đổi từ started thành restarted để ép node cập nhật lại tham số mạng ngay lập tức