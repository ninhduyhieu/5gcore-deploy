---
- name: Wait for K3s API server to be ready
  wait_for:
    port: 6443
    host: 127.0.0.1
    timeout: 180

- name: Install Calico manifests
  command: >
    kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
    apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.31.4/manifests/calico.yaml
  retries: 3
  delay: 5
  register: result
  until: result.rc == 0
  changed_when: true

- name: Force Calico to use Vagrant host-only interface
  command: >
    kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
    set env daemonset/calico-node -n kube-system
    IP_AUTODETECTION_METHOD=interface=enp0s8
  changed_when: true

- name: Wait for Calico node pods to be Ready
  command: >
    kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
    wait --for=condition=Ready pod
    -n kube-system
    -l k8s-app=calico-node
    --timeout=300s
  retries: 30
  delay: 10
  register: calico_ready
  until: calico_ready.rc == 0
  changed_when: false

