---
- name: Wait for K3s API server to be ready
  wait_for:
    port: 6443
    host: 127.0.0.1
    timeout: 120

- name: Install Calico operator CRDs
  command: kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.31.4/manifests/operator-crds.yaml
  retries: 3
  delay: 5
  register: result
  until: result.rc == 0

- name: Install Calico tigera-operator
  command: kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.31.4/manifests/tigera-operator.yaml
  retries: 3
  delay: 5
  register: result
  until: result.rc == 0

- name: Install Calico manifests
  command: kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.31.4/manifests/calico.yaml
  retries: 3
  delay: 5
  register: result
  until: result.rc == 0

- name: Wait for Calico pods to be running
  shell: kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml get pods -n kube-system -l k8s-app=calico-node --no-headers
  register: calico_pods
  until: "'Running' in calico_pods.stdout"
  retries: 30
  delay: 10
  