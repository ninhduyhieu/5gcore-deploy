---
- name: Ensure ctr is available
  shell: ctr version
  changed_when: false

- name: Find image tar files
  find:
    paths: /vagrant/artifacts
    patterns: "*.tar"
    file_type: file
  register: image_tar_files

- name: Fail if no image tar files found
  fail:
    msg: "No image tar files found in /vagrant/artifacts"
  when: image_tar_files.matched | int == 0

- name: Import image tar files into containerd
  shell: ctr -n k8s.io images import {{ item.path }}
  args:
    executable: /bin/bash
  loop: "{{ image_tar_files.files }}"
  changed_when: true

- name: Verify imported images
  shell: ctr -n k8s.io images ls
  register: imported_images
  changed_when: false

- name: Print imported images
  debug:
    var: imported_images.stdout_lines