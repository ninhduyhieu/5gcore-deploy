---
- name: Create database namespace
  shell: kubectl create namespace {{ db_namespace }} --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Deploy MongoDB on centre cloud
  command: kubectl apply -f /vagrant/ansible/roles/deploy_database/files/mongodb-center.yml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Wait for MongoDB deployment to become ready
  command: kubectl -n {{ db_namespace }} rollout status deployment/mongodb --timeout=300s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false