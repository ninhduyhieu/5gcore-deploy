apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: v1
kind: Service
metadata:
  name: app-edge
  namespace: apps
spec:
  selector:
    app: app-edge
  ports:
    - port: 8080
      targetPort: 5678
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-edge
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-edge
  template:
    metadata:
      labels:
        app: app-edge
    spec:
      nodeSelector:
        cloud: edge
      containers:
        - name: app-edge
          image: hashicorp/http-echo:1.0.0
          args:
            - "-text=hello-from-edge-cloud"
          ports:
            - containerPort: 5678