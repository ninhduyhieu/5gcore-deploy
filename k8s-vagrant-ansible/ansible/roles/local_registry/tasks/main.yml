---
- name: Ensure Docker config directory exists
  file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Configure Docker insecure registry on master
  copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "insecure-registries": ["{{ local_registry }}"]
      }

- name: Restart Docker
  systemd:
    name: docker
    state: restarted
    enabled: yes

- name: Pull registry image
  shell: docker pull registry:2
  changed_when: true

- name: Remove old local registry container if exists
  shell: docker rm -f local-registry >/dev/null 2>&1 || true
  changed_when: true

- name: Run local registry container
  shell: |
    docker run -d \
      --restart=always \
      --name local-registry \
      -p {{ local_registry_port }}:5000 \
      registry:2
  changed_when: true

- name: Wait for local registry port
  wait_for:
    host: 127.0.0.1
    port: "{{ local_registry_port }}"
    timeout: 30
