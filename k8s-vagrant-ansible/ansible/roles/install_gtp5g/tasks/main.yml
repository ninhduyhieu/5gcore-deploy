---
- name: Install dependencies for gtp5g
  apt:
    name:
      - git
      - make
      - gcc
      - linux-headers-{{ ansible_kernel }}
    state: present
    update_cache: yes

- name: Remove old gtp5g module if exists
  shell: |
    if lsmod | grep -q gtp5g; then
      rmmod gtp5g || true
    fi
  ignore_errors: yes

- name: Remove old gtp5g source
  file:
    path: /home/vagrant/gtp5g
    state: absent

# 🔥 QUAN TRỌNG: fix version tại đây
- name: Clone gtp5g source (fixed version)
  git:
    repo: https://github.com/free5gc/gtp5g.git
    dest: /home/vagrant/gtp5g
    version: v0.8.2

- name: Build gtp5g kernel module
  shell: |
    cd /home/vagrant/gtp5g
    make clean
    make
  args:
    executable: /bin/bash

- name: Install gtp5g kernel module
  shell: |
    cd /home/vagrant/gtp5g
    make install
  args:
    executable: /bin/bash

- name: Ensure gtp5g loads on boot
  copy:
    dest: /etc/modules-load.d/gtp5g.conf
    content: |
      gtp5g

- name: Load gtp5g module now
  shell: modprobe gtp5g

- name: Verify gtp5g is loaded
  shell: lsmod | grep gtp5g
  register: gtp5g_loaded

- name: Print gtp5g status
  debug:
    var: gtp5g_loaded.stdout_lines