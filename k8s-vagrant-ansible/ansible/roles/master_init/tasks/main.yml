---
- name: Check if cluster already initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf

- name: Reset old kubeadm state if needed
  shell: kubeadm reset -f
  when: not admin_conf.stat.exists
  changed_when: false

- name: Init cluster
  shell: >
    kubeadm init
    --apiserver-advertise-address={{ apiserver_advertise_address }}
    --pod-network-cidr={{ pod_network_cidr }}
    --service-cidr=10.100.100.0/24
    --cri-socket {{ cri_socket }}
    --kubernetes-version v1.29.15
  when: not admin_conf.stat.exists
  register: kubeadm_init

- name: Create .kube directory for vagrant
  file:
    path: /home/vagrant/.kube
    state: directory
    owner: vagrant
    group: vagrant
    mode: "0755"

- name: Copy admin.conf for vagrant user
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/vagrant/.kube/config
    remote_src: true
    owner: vagrant
    group: vagrant
    mode: "0644"

- name: Wait until kube-apiserver is reachable
  shell: kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes
  register: api_ready
  retries: 30
  delay: 10
  until: api_ready.rc == 0
  changed_when: false

- name: Ensure kube-flannel namespace exists
  shell: kubectl --kubeconfig=/etc/kubernetes/admin.conf create namespace kube-flannel --dry-run=client -o yaml | kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f -
  changed_when: false

- name: Delete old flannel DaemonSet in kube-system if exists
  shell: kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-system delete daemonset kube-flannel-ds --ignore-not-found=true
  changed_when: false

- name: Delete old flannel DaemonSet in kube-flannel if exists
  shell: kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-flannel delete daemonset kube-flannel-ds --ignore-not-found=true
  changed_when: false

- name: Wait for old flannel DaemonSet to be removed
  shell: |
    ds1=$(kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-system get ds kube-flannel-ds --ignore-not-found -o name)
    ds2=$(kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-flannel get ds kube-flannel-ds --ignore-not-found -o name)
    if [ -z "$ds1" ] && [ -z "$ds2" ]; then
      echo 0
    else
      echo 1
    fi
  register: flannel_ds_gone
  retries: 30
  delay: 5
  until: flannel_ds_gone.stdout | trim == "0"
  changed_when: false

- name: Apply Flannel manifest
  shell: kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
  register: flannel_apply
  changed_when: "'created' in flannel_apply.stdout or 'configured' in flannel_apply.stdout"

- name: Wait for Flannel DaemonSet to exist
  shell: kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-flannel get ds kube-flannel-ds -o name
  register: flannel_ds
  retries: 30
  delay: 10
  until: flannel_ds.rc == 0
  changed_when: false

- name: Wait for Flannel rollout
  shell: kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-flannel rollout status daemonset/kube-flannel-ds --timeout=600s
  changed_when: false

- name: Wait for all nodes to become Ready
  shell: |
    kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes --no-headers \
    | awk '{print $2}' \
    | grep -vc '^Ready$' || true
  register: not_ready_nodes
  retries: 30
  delay: 10
  until: (not_ready_nodes.stdout | trim) == "0"
  changed_when: false
  failed_when: false

- name: Wait for core system pods to be ready
  shell: |
    kubectl --kubeconfig=/etc/kubernetes/admin.conf get pods -n kube-system --no-headers \
    | awk '$3 != "Running" && $3 != "Completed" {count++} END {print count+0}'
  register: not_ready_kubesystem
  retries: 60
  delay: 10
  until: not_ready_kubesystem.stdout == "0"
  changed_when: false

- name: Wait for kube-flannel pods to be ready
  shell: |
    kubectl --kubeconfig=/etc/kubernetes/admin.conf get pods -n kube-flannel --no-headers \
    | awk '$3 != "Running" && $3 != "Completed" {count++} END {print count+0}'
  register: not_ready_flannel
  retries: 60
  delay: 10
  until: not_ready_flannel.stdout == "0"
  changed_when: false

- name: Wait for control-plane node ready
  shell: kubectl --kubeconfig=/etc/kubernetes/admin.conf get node k8s-master --no-headers | awk '{print $2}'
  register: master_ready
  retries: 30
  delay: 10
  until: "'Ready' in master_ready.stdout"
  changed_when: false

- name: Create join command
  shell: kubeadm token create --print-join-command
  register: join_command
  changed_when: false

- name: Save join command to shared folder
  copy:
    dest: "{{ join_command_file }}"
    mode: "0755"
    content: |
      {{ join_command.stdout }} --cri-socket {{ cri_socket }}

- name: Fix kubelet node-ip trên master
  copy:
    dest: /var/lib/kubelet/kubeadm-flags.env
    content: |
      KUBELET_KUBEADM_ARGS="--node-ip={{ node_ip }} --container-runtime-endpoint=unix:///run/containerd/containerd.sock --pod-infra-container-image=registry.k8s.io/pause:3.9"
    owner: root
    group: root
    mode: '0644'

- name: Restart kubelet sau khi fix node-ip
  systemd:
    name: kubelet
    state: restarted
    daemon_reload: yes