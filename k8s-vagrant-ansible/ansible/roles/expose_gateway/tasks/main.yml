---
- name: Wait for gateway deployment
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ gateway_namespace }} get deploy gateway-dep
  register: gateway_dep_check
  retries: 30
  delay: 10
  until: gateway_dep_check.rc == 0
  changed_when: false

- name: Wait for gateway service
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ gateway_namespace }} get svc {{ gateway_service_name }}
  register: gateway_svc_check
  retries: 30
  delay: 10
  until: gateway_svc_check.rc == 0
  changed_when: false

- name: Ensure gateway service is NodePort 30007
  shell: |
    kubectl --kubeconfig={{ kubeconfig_path }} -n {{ gateway_namespace }} patch svc {{ gateway_service_name }} \
    --type='merge' \
    -p '{"spec":{"type":"NodePort","ports":[{"port":7777,"targetPort":7777,"protocol":"TCP","nodePort":{{ gateway_nodeport }}}]}}'
  changed_when: true

- name: Show gateway service
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ gateway_namespace }} get svc {{ gateway_service_name }} -o wide
  register: gateway_svc_out
  changed_when: false

- name: Print gateway service
  debug:
    var: gateway_svc_out.stdout_lines