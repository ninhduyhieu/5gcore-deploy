---
- name: Ensure generated manifest directory exists
  file:
    path: "{{ generated_manifest_dir }}"
    state: directory
    mode: "0755"

- name: Render namespace manifest
  copy:
    dest: "{{ generated_manifest_dir }}/namespace.yaml"
    mode: "0644"
    content: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: {{ core_namespace }}

- name: Render custom controller manifest
  template:
    src: controller.yaml.j2
    dest: "{{ generated_manifest_dir }}/controller.yaml"
    mode: "0644"

- name: Render custom gateway manifest
  template:
    src: gateway.yaml.j2
    dest: "{{ generated_manifest_dir }}/gateway.yaml"
    mode: "0644"

- name: Render custom NSM manifest
  template:
    src: nsm.yaml.j2
    dest: "{{ generated_manifest_dir }}/nsm.yaml"
    mode: "0644"

- name: Render PRAN manifest
  template:
    src: pran.yaml.j2
    dest: "{{ generated_manifest_dir }}/pran.yaml"
    mode: "0644"

- name: Apply namespace
  shell: kubectl --kubeconfig={{ kubeconfig_path }} apply -f {{ generated_manifest_dir }}/namespace.yaml
  changed_when: false

- name: Apply controller
  shell: kubectl --kubeconfig={{ kubeconfig_path }} apply -f {{ generated_manifest_dir }}/controller.yaml
  changed_when: true

- name: Wait for controller rollout
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} rollout status deployment/ctrl-dep --timeout=300s
  changed_when: false

- name: Apply service discovery definitions
  shell: kubectl --kubeconfig={{ kubeconfig_path }} apply -f {{ repo_manifests.services }}
  changed_when: true

- name: Apply gateway
  shell: kubectl --kubeconfig={{ kubeconfig_path }} apply -f {{ generated_manifest_dir }}/gateway.yaml
  changed_when: true

- name: Wait for gateway rollout
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} rollout status deployment/gateway-dep --timeout=300s
  changed_when: false

- name: Wait for gateway service endpoints
  shell: |
    kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} get endpoints gateway-svc \
    -o jsonpath='{.subsets[*].addresses[*].ip}'
  register: gateway_eps
  retries: 30
  delay: 5
  until: gateway_eps.stdout | trim != ""
  changed_when: false

- name: Check whether NSM deployment exists
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} get deployment nsm-dep --ignore-not-found -o name
  register: nsm_deploy_exists
  changed_when: false

- name: Scale down old NSM deployment to zero
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} scale deployment nsm-dep --replicas=0
  when: nsm_deploy_exists.stdout | trim != ""
  changed_when: true

- name: Force delete old NSM pods if exist
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} delete pod -l app=nsm --force --grace-period=0 --ignore-not-found=true || true
  changed_when: false

- name: Wait until all old NSM pods are gone
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} get pods -l app=nsm --no-headers 2>/dev/null | wc -l
  register: nsm_pod_count
  retries: 30
  delay: 5
  until: (nsm_pod_count.stdout | int) == 0
  changed_when: false

- name: Apply NSM
  shell: kubectl --kubeconfig={{ kubeconfig_path }} apply -f {{ generated_manifest_dir }}/nsm.yaml
  changed_when: true

- name: Wait for NSM rollout
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} rollout status deployment/nsm-dep --timeout=120s
  register: nsm_rollout
  changed_when: false
  failed_when: false
- name: Show NSM pod status
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} get pods -l app=nsm -o wide
  register: nsm_pods
  changed_when: false
  failed_when: false

- name: Describe NSM pods
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} describe pod -l app=nsm
  register: nsm_desc
  changed_when: false
  failed_when: false
- name: Get NSM logs
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} logs -l app=nsm --all-containers=true --tail=200
  register: nsm_logs
  changed_when: false
  failed_when: false

- name: Get previous NSM logs
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} logs -l app=nsm --all-containers=true --previous --tail=200
  register: nsm_prev_logs
  changed_when: false
  failed_when: false

- name: Print NSM logs
  debug:
    var: nsm_logs.stdout_lines

- name: Print previous NSM logs
  debug:
    var: nsm_prev_logs.stdout_lines
- name: Print NSM pod status
  debug:
    var: nsm_pods.stdout_lines

- name: Print NSM pod description
  debug:
    var: nsm_desc.stdout_lines

- name: Wait for NSM service endpoints
  shell: |
    kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} get endpoints nsm-208-93 \
    -o jsonpath='{.subsets[*].addresses[*].ip}'
  register: nsm_eps
  retries: 6
  delay: 5
  until: nsm_eps.stdout | trim != ""
  changed_when: false
  failed_when: false

- name: Show NSM endpoints
  debug:
    var: nsm_eps.stdout

- name: Continue even if NSM endpoint is empty
  debug:
    msg: "NSM endpoint is empty; continue for debugging"
  when: nsm_eps.stdout | trim == ""

- name: Apply UDR
  shell: kubectl --kubeconfig={{ kubeconfig_path }} apply -f {{ repo_manifests.udr }}
  changed_when: true

- name: Wait for UDR rollout
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} rollout status deployment/mongo-db --timeout=300s
  changed_when: false
  failed_when: false

- name: Apply UDM
  shell: kubectl --kubeconfig={{ kubeconfig_path }} apply -f {{ repo_manifests.udm }}
  changed_when: true

- name: Apply AUSF
  shell: kubectl --kubeconfig={{ kubeconfig_path }} apply -f {{ repo_manifests.ausf }}
  changed_when: true

- name: Apply PCF
  shell: kubectl --kubeconfig={{ kubeconfig_path }} apply -f {{ repo_manifests.pcf }}
  changed_when: true

- name: Wait for UDM rollout
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} rollout status deployment/udm-dep --timeout=300s
  changed_when: false
  failed_when: false

- name: Wait for AUSF rollout
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} rollout status deployment/ausf-dep --timeout=300s
  changed_when: false
  failed_when: false

- name: Wait for PCF rollout
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} rollout status deployment/pcf-dep --timeout=300s
  changed_when: false
  failed_when: false

- name: Apply DAMF
  shell: kubectl --kubeconfig={{ kubeconfig_path }} apply -f {{ repo_manifests.damf }}
  changed_when: true

- name: Apply SMF
  shell: kubectl --kubeconfig={{ kubeconfig_path }} apply -f {{ repo_manifests.smf }}
  changed_when: true

- name: Wait for DAMF rollout
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} rollout status deployment/damf-dep --timeout=300s
  changed_when: false
  failed_when: false

- name: Wait for SMF rollout
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} rollout status deployment/smf-slice1-dep --timeout=300s
  changed_when: false
  failed_when: false

- name: Apply AMF 10-100
  shell: kubectl --kubeconfig={{ kubeconfig_path }} apply -f {{ repo_manifests.amf_10_100 }}
  changed_when: true

- name: Apply AMF 10-101
  shell: kubectl --kubeconfig={{ kubeconfig_path }} apply -f {{ repo_manifests.amf_10_101 }}
  changed_when: true

- name: Apply AMF 10-102
  shell: kubectl --kubeconfig={{ kubeconfig_path }} apply -f {{ repo_manifests.amf_10_102 }}
  changed_when: true

- name: Wait for AMF 10-100 rollout
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} rollout status deployment/amf-10-100-dep --timeout=300s
  changed_when: false
  failed_when: false

- name: Wait for AMF 10-101 rollout
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} rollout status deployment/amf-10-101-dep --timeout=300s
  changed_when: false
  failed_when: false

- name: Wait for AMF 10-102 rollout
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} rollout status deployment/amf-10-102-dep --timeout=300s
  changed_when: false
  failed_when: false

- name: Apply PRAN
  shell: kubectl --kubeconfig={{ kubeconfig_path }} apply -f {{ generated_manifest_dir }}/pran.yaml
  changed_when: true

- name: Patch replicas and nodeSelector for deployments
  shell: |
    kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} patch deployment {{ item.value.deployment }} \
      --type='merge' \
      -p '{"spec":{"replicas":{{ item.value.replicas }},"template":{"spec":{"nodeSelector":{"site":"{{ item.value.site }}"}}}}}'
  loop: "{{ nf_layout | dict2items }}"
  changed_when: true

- name: Wait for PRAN rollout
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} rollout status deployment/pran-dep --timeout=300s
  changed_when: false
  failed_when: false

- name: Show core pods
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} get pods -o wide
  register: core_pods_out
  changed_when: false
  failed_when: false

- name: Print core pod list
  debug:
    var: core_pods_out.stdout_lines

- name: Show core services
  shell: kubectl --kubeconfig={{ kubeconfig_path }} -n {{ core_namespace }} get svc -o wide
  register: core_svcs_out
  changed_when: false
  failed_when: false

- name: Print core service list
  debug:
    var: core_svcs_out.stdout_lines