          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["./gateway"]
          args: ["-c", "/etc/config/gateway.json"]
          volumeMounts:
            - mountPath: /etc/config
              name: gateway-config
          ports:
            - containerPort: 7777
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nsm-dep
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: {{ .Values.layout.nsm.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nsm
  template:
    metadata:
      labels:
        app: nsm
        plmnId: {{ .Values.global.plmn.label | quote }}
    spec:
      nodeSelector:
        site: {{ .Values.layout.nsm.site }}
      volumes:
        - name: nsm-config
          configMap:
            name: nsm-config
      containers:
        - name: nsm
          image: {{ include "etrib5gc.image" (dict "Values" .Values "image" "b5gc-nsm") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["./nsm"]
          args: ["-c", "/etc/config/nsm.json"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - mountPath: /etc/config
              name: nsm-config
          ports:
            - containerPort: 9001
            - containerPort: 7001
          readinessProbe:
            tcpSocket:
              port: 9001
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 9001
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-db
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    matchLabels:
      app: udr
  replicas: {{ .Values.layout.udr.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 1 }
  minReadySeconds: 5
  template:
    metadata:
      labels:
        app: udr
    spec:
      nodeSelector:
        site: {{ .Values.layout.udr.site }}
      containers:
        - name: mongo-db
          image: {{ .Values.global.imageRegistry }}/mongo:latest
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 27017
              name: mongodb
          volumeMounts:
            - name: mongodb-persistent-storage
              mountPath: /data/db
      volumes:
        - name: mongodb-persistent-storage
          persistentVolumeClaim:
            claimName: mongodb-pvc
---
