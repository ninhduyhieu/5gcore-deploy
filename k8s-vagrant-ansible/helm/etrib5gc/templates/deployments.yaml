apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctrl-dep
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: {{ .Values.layout.controller.replicas }}
  selector:
    matchLabels:
      app: controller
  template:
    metadata:
      labels:
        app: controller
    spec:
      serviceAccountName: ctrl-acc
      nodeSelector:
        site: {{ .Values.layout.controller.site }}
      volumes:
        - name: ctrl-config
          configMap:
            name: ctrl-config
      containers:
        - name: b5gc-ctrl
          image: {{ include "etrib5gc.image" (dict "Values" .Values "image" "b5gc-controller") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["./controller"]
          args: ["-c", "/etc/config/controller.json"]
          volumeMounts:
            - mountPath: /etc/config
              name: ctrl-config
          ports:
            - containerPort: 8888
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-dep
  namespace: {{ .Values.global.namespace }}
spec:
  strategy: { type: Recreate }
