# === GATEWAY (Single Gateway) ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-dep
  namespace: etri6g
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      volumes:
        - name: gateway-config
          configMap:
            name: gateway-config
      containers:
        - name: b5gc-gateway
          image: b5gc-gateway:latest
          imagePullPolicy: IfNotPresent
          command: ["./gateway"]
          args: ["-c", "/etc/config/gateway.json"]
          volumeMounts:
            - mountPath: /etc/config
              name: gateway-config
          ports:
            - containerPort: 7777
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      serviceAccountName: gw-acc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gw-acc
  namespace: etri6g
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: get-pods-role
  namespace: etri6g
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-get-pods-role
  namespace: etri6g
subjects:
  - kind: ServiceAccount
    name: gw-acc
    namespace: etri6g
roleRef:
  kind: Role
  name: get-pods-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: etri6g
data:
  gateway.json: |
    {
      "registeredAddr": "192.168.58.11:30007",
      "controller": "ctrl-svc:8888",
      "labels": {
        "loc": "cluster1"
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
  namespace: etri6g
spec:
  selector:
    app: gateway
  ports:
    - protocol: TCP
      port: 7777
      targetPort: 7777
      nodePort: 30007
  type: NodePort

